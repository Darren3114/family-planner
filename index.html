<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home">
<meta name="theme-color" content="#0E161B">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Expanded:wght@500;600;700;800&family=Creepster&family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E161B;
  --ink-2:#16232B;
  --ink-3:#1F313B;
  --rule:#2A414E;
  --chalk:#F1EDE2;
  --chalk-dim:#93A6B0;
  --chalk-faint:#5B7280;
  --now:#FFB020;
  --btnbg:#FFB020;--btntext:#241700;
  --grabs:#5ED6B5;--grabstext:#0E161B;
  --danger:#EC7099;--dangertext:#0E161B;
  --ok:#A9D84E;
  --past:.32;
  --scrim:rgba(6,11,14,.82);
  --pad:22px;
  --display:'Archivo Expanded','Archivo',-apple-system,sans-serif;
}
html[data-theme="paper"]{--ink:#F3EFE6;--ink-2:#FBF9F4;--ink-3:#ECE6D9;--rule:#E0D8C8;--chalk:#1B2328;--chalk-dim:#56636A;--chalk-faint:#7F8A8F;--now:#A85C00;--grabs:#8A4A00;--grabstext:#FFFFFF;--danger:#B8305F;--dangertext:#FFFFFF;--ok:#4E7A0C;--scrim:rgba(40,34,24,.45);}
html[data-theme="daylight"]{--ink:#E9EEF1;--ink-2:#FFFFFF;--ink-3:#F2F5F7;--rule:#DCE3E7;--chalk:#0E161B;--chalk-dim:#4F6069;--chalk-faint:#7C8C95;--now:#A85C00;--grabs:#8A4A00;--grabstext:#FFFFFF;--danger:#B8305F;--dangertext:#FFFFFF;--ok:#4E7A0C;--scrim:rgba(14,22,27,.4);}
html[data-theme="daylight"] .card,html[data-theme="daylight"] .cardlink,html[data-theme="daylight"] .col,html[data-theme="daylight"] .cell:not(.out),html[data-theme="daylight"] .panel,html[data-theme="daylight"] .pcard,html[data-theme="daylight"] .sbtn{box-shadow:0 1px 2px rgba(14,22,27,.06),0 4px 14px rgba(14,22,27,.05);}
html[data-theme="daylight"] .col.today,html[data-theme="daylight"] .cell.now{box-shadow:inset 0 0 0 1.5px #E39A12;}

/* ---- Sea glass ---- */
html[data-theme="seaglass"]{--ink:#CFECE9;--ink-2:#F6FCFB;--ink-3:#E1F4F2;--rule:#A9D3CF;--chalk:#0C3338;--chalk-dim:#2A5A5F;--chalk-faint:#3A6A6C;--now:#B3321F;--btnbg:#B3321F;--btntext:#FFFFFF;--grabs:#8A4A00;--grabstext:#FFFFFF;--danger:#B3321F;--dangertext:#FFFFFF;--ok:#3F6F0F;--past:.5;--scrim:rgba(12,51,56,.4);}
html[data-theme="seaglass"] .card,html[data-theme="seaglass"] .cardlink,html[data-theme="seaglass"] .col,html[data-theme="seaglass"] .cell:not(.out),html[data-theme="seaglass"] .panel,html[data-theme="seaglass"] .pcard,html[data-theme="seaglass"] .sbtn{box-shadow:0 1px 2px rgba(12,51,56,.07),0 4px 14px rgba(12,51,56,.06);}
html[data-theme="seaglass"] .col.today,html[data-theme="seaglass"] .cell.now{box-shadow:inset 0 0 0 1.5px var(--now);}
html[data-theme="seaglass"] body::before{content:'';position:fixed;right:-70px;bottom:-90px;width:460px;height:460px;border-radius:50%;pointer-events:none;z-index:0;opacity:.55;
  background:repeating-radial-gradient(circle at 50% 50%,transparent 0 62px,var(--rule) 62px 64px);-webkit-mask-image:radial-gradient(circle,#000 30%,transparent 72%);mask-image:radial-gradient(circle,#000 30%,transparent 72%);}

/* ---- Halloween ---- */
html[data-theme="halloween"]{--ink:#150B21;--ink-2:#21132F;--ink-3:#2D1A42;--rule:#44296A;--chalk:#F6EAD8;--chalk-dim:#C4B3D6;--chalk-faint:#A894C2;--now:#FF8A1F;--btnbg:#FF8A1F;--btntext:#1D0C00;--grabs:#7CE04A;--grabstext:#150B21;--danger:#FF82B0;--dangertext:#150B21;--ok:#9DE766;--past:.5;--scrim:rgba(10,4,20,.82);}
html[data-theme="halloween"] body{background-image:radial-gradient(900px 520px at 78% 105%,#3B1D5C 0%,transparent 70%),radial-gradient(700px 400px at 5% -10%,#2A1450 0%,transparent 70%);}
html[data-theme="halloween"] .datestamp{font-family:'Creepster','Archivo',sans-serif;font-weight:400;letter-spacing:.06em;font-size:46px;}
html[data-theme="halloween"] .datestamp .rest{font-weight:400;}

/* ---- Christmas (sage + cranberry) ---- */
html[data-theme="christmas"]{--ink:#CCDBC5;--ink-2:#F4F8EE;--ink-3:#E3EDDB;--rule:#A9C1A1;--chalk:#14301E;--chalk-dim:#2F4D38;--chalk-faint:#3C5A45;--now:#A81C2B;--btnbg:#A81C2B;--btntext:#FFFFFF;--grabs:#E3B23C;--grabstext:#14301E;--danger:#A81C2B;--dangertext:#FFFFFF;--ok:#356006;--past:.5;--scrim:rgba(20,48,30,.45);}
html[data-theme="christmas"] body{background-image:radial-gradient(900px 500px at 85% 0%,#DCE8D4 0%,transparent 65%);}
html[data-theme="christmas"] .datestamp{font-family:'Mountains of Christmas','Archivo',sans-serif;font-weight:700;font-size:48px;letter-spacing:.01em;}
html[data-theme="christmas"] .datestamp .rest{font-weight:700;}
html[data-theme="christmas"] .top{padding-top:18px;padding-bottom:2px;}
html[data-theme="christmas"] nav{padding-bottom:8px;}
html[data-theme="christmas"] .card,html[data-theme="christmas"] .cardlink{box-shadow:0 2px 0 rgba(20,48,30,.12);}
html[data-theme="christmas"] .stepper{border-top:none;position:relative;padding-top:18px;}
html[data-theme="christmas"] .stepper::before{content:'';position:absolute;left:0;right:0;top:2px;height:7px;border-radius:4px;background:repeating-linear-gradient(135deg,#A81C2B 0 9px,#F4F8EE 9px 18px);}
html[data-theme="christmas"] .rail{padding-top:22px;margin-top:-22px;}
html[data-theme="christmas"] .nowline .bar{height:2px;opacity:.8;}
html[data-theme="christmas"] .addbtn{box-shadow:0 2px 0 #7C1020;}

/* ---- Royal blue (blue + yellow) ---- */
html[data-theme="royal"]{--ink:#14307F;--ink-2:#1B3F9E;--ink-3:#2450BA;--rule:#3F6AD6;--chalk:#F6F2E4;--chalk-dim:#C9D6F8;--chalk-faint:#A9BDF2;--now:#FFD83A;--btnbg:#FFD83A;--btntext:#14307F;--grabs:#FFD83A;--grabstext:#14307F;--danger:#FF9DBF;--dangertext:#14307F;--ok:#B4EC66;--past:.5;--scrim:rgba(6,16,64,.84);}
html[data-theme="royal"] .datestamp{color:var(--now);}
html[data-theme="royal"] .tab.on{background:var(--now);color:var(--ink);}
html[data-theme="royal"] .ev .t,html[data-theme="royal"] .chip .ct,html[data-theme="royal"] .mev b,html[data-theme="royal"] .card h2,html[data-theme="royal"] .cardlink h2{color:var(--now);}
html[data-theme="royal"] .anytime .ev .t{color:var(--chalk-dim);}
html[data-theme="royal"] .card h2 .count,html[data-theme="royal"] .cardlink h2 .count{color:var(--chalk-dim);}
html[data-theme="royal"] .box{border-color:var(--chalk-dim);}
html[data-theme="royal"] .row.done .box{background:var(--chalk-dim);}

/* ---- Red & white (three designs). The red V is the heritage guernsey idea; no club logo is used. ---- */
html[data-theme="swansB"]{--ink:#C8102E;--ink-2:#FFFFFF;--ink-3:#F6EAEA;--rule:#EAD6D6;--chalk:#1E0B0F;--chalk-dim:#5E474C;--chalk-faint:#7A5F65;--now:#C8102E;--btnbg:#C8102E;--btntext:#FFFFFF;--grabs:#C8102E;--grabstext:#FFFFFF;--danger:#A30D26;--dangertext:#FFFFFF;--ok:#2E7D32;--past:.5;--scrim:rgba(40,8,12,.55);}
/* header sits on red in all three */
html[data-theme^="swans"] .datestamp{color:#FFFFFF;}
html[data-theme^="swans"] .datestamp .rest,html[data-theme^="swans"] .clock{color:#FFE2E5;}
html[data-theme^="swans"] .iconbtn{color:#FFFFFF;}
html[data-theme^="swans"] .sdot{background:#FFE2E5;}
html[data-theme^="swans"] .sdot.ok{background:#8CE99A;}
html[data-theme^="swans"] .sdot.wait{background:#FFD84A;}
html[data-theme^="swans"] .sdot.err{background:#FFFFFF;box-shadow:0 0 0 4px rgba(255,255,255,.35);}
html[data-theme^="swans"] .tab{color:#FFE2E5;}
html[data-theme^="swans"] .tab.on{background:#FFFFFF;color:#C8102E;}
html[data-theme^="swans"] .addbtn{background:#FFFFFF;color:#C8102E;}
html[data-theme^="swans"] .card h2,html[data-theme^="swans"] .cardlink h2{color:#C8102E;}
html[data-theme^="swans"] .card h2 .count,html[data-theme^="swans"] .cardlink h2 .count{color:var(--chalk-dim);}
html[data-theme^="swans"] .dayhead{color:#C8102E;}
html[data-theme^="swans"] .ev.next .t{color:#C8102E;}
html[data-theme^="swans"] .ev.next{border-left-color:#C8102E;}
html[data-theme^="swans"] .nowline .bar{background:#C8102E;opacity:.7;}
html[data-theme^="swans"] .col.today .num,html[data-theme^="swans"] .cell.now .cn{color:#C8102E;}
html[data-theme^="swans"] .col.today,html[data-theme^="swans"] .cell.now{box-shadow:inset 0 0 0 2px #C8102E;}
html[data-theme^="swans"] .box{color:#FFFFFF;}
html[data-theme^="swans"] .pbtns button,html[data-theme^="swans"] .wchip.on{color:#FFFFFF;}
html[data-theme^="swans"] .shead{border-bottom-color:#C8102E;}
html[data-theme^="swans"] .shead .stxt{color:#C8102E;}
html[data-theme^="swans"] .card,html[data-theme^="swans"] .cardlink,html[data-theme^="swans"] .col,html[data-theme^="swans"] .cell:not(.out),html[data-theme^="swans"] .panel,html[data-theme^="swans"] .pcard{box-shadow:0 1px 2px rgba(60,10,16,.08),0 4px 14px rgba(60,10,16,.07);}
/* Swans. A red page with everything sitting on white cards, plus the game-day decorations. */
html[data-theme="swansB"] .todaycol{background:#FFFFFF;border-radius:18px;padding:14px 18px 10px;}
html[data-theme="swansB"] .stepper .sbtn{background:var(--ink-3);}
html[data-theme="swansB"] .view.stepview>.stepper{border-top-color:rgba(255,255,255,.45);}
html[data-theme="swansB"] .view.stepview .sbtn{background:rgba(255,255,255,.22);color:#FFFFFF;}
html[data-theme="swansB"] .view.stepview .slabel{color:#FFFFFF;}
html[data-theme="swansB"] .view.stepview .slabel small{color:#FFE2E5;}
html[data-theme="swansB"] .mhead div{color:#FFE2E5;}
html[data-theme="swansB"] .mbar h2{color:#FFFFFF;}
html[data-theme="swansB"] .cell.out{box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);}
html[data-theme="swansB"] .cell.out .cn{color:#FFD0D6;}
html[data-theme="swansB"] .toast{color:#FFFFFF;}
html[data-theme="swansB"] .toast button{background:#C8102E;color:#FFFFFF;}
html[data-theme="swansB"] .panel .clear{color:var(--chalk-dim);}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background-color:var(--ink);}
body{
  color:var(--chalk);
  font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);
  position:relative;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input{font:inherit;color:inherit;background:none;border:none;outline:none;-webkit-user-select:text;user-select:text;border-radius:0;}
button:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:2px solid var(--now);outline-offset:2px;}

/* ---------- seasonal overlays ---------- */
.ov{position:fixed;pointer-events:none;display:none;}
html[data-theme="halloween"] #ovHW,html[data-theme="christmas"] #ovXM,html[data-theme="swansB"] #ovSW{display:block;}
#ovSW{z-index:30;}
#ovSW .sw-bunt{position:fixed;left:0;top:0;width:100%;height:30px;z-index:8;}
html[data-theme="swansB"] .top{padding-top:26px;}
body.phone .ov{display:none !important;}
#ovHW .ov-stars,#ovXM .ov-snow{position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;}
#ovXM .ov-snow{opacity:.75;}
#ovHW .ov-bats{position:fixed;right:0;top:0;width:min(700px,65vw);height:auto;z-index:10;}
#ovHW .ov-web{position:fixed;right:0;top:0;width:min(470px,44vw);height:auto;z-index:10;}
#ovXM .ov-garland{position:fixed;left:0;top:0;width:100%;height:46px;z-index:8;}
.top,nav,main,.pnav{position:relative;z-index:2;}

/* ---------- chrome ---------- */
.top{display:flex;align-items:center;gap:14px;padding:14px var(--pad) 10px;}
.datestamp{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:.01em;white-space:nowrap;}
.datestamp .rest{color:var(--chalk-dim);font-weight:500;}
.clock{font-family:var(--display);font-weight:600;font-size:40px;color:var(--chalk-dim);font-variant-numeric:tabular-nums;}
.topr{margin-left:auto;display:flex;align-items:center;gap:6px;}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--chalk-faint);}
.iconbtn svg{width:22px;height:22px;}
.sdot{width:11px;height:11px;border-radius:50%;background:var(--chalk-faint);}
.sdot.ok{background:var(--ok);}
.sdot.wait{background:var(--now);}
.sdot.err{background:var(--danger);box-shadow:0 0 0 4px rgba(236,112,153,.22);}

nav{display:flex;gap:6px;padding:0 var(--pad) 12px;align-items:center;}
.tab{flex:0 0 auto;padding:11px 20px;border-radius:999px;font-size:21px;font-weight:600;letter-spacing:.02em;color:var(--chalk-faint);min-height:54px;}
.tab.on{color:var(--ink);background:var(--chalk);}
.addbtn{margin-left:auto;flex:0 0 auto;padding:11px 26px;border-radius:999px;background:var(--btnbg);color:var(--btntext);font-weight:700;font-size:21px;letter-spacing:.02em;min-height:54px;}

main{flex:1;min-height:0;padding:0 var(--pad) var(--pad);}
.view{display:none;height:100%;}
.view.on{display:flex;gap:16px;}
.empty{font-size:15px;color:var(--chalk-faint);padding:6px 0 2px;}

/* ---------- today ---------- */
.todaycol{flex:1 1 60%;min-width:0;display:flex;flex-direction:column;}
.dayhead{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--now);padding:2px 0 8px;}
.stepper{display:flex;align-items:center;gap:10px;padding-top:12px;margin-top:4px;border-top:1px solid var(--rule);}
.sbtn{flex:0 0 auto;width:72px;height:54px;border-radius:14px;background:var(--ink-2);display:grid;place-items:center;color:var(--chalk-dim);}
.sbtn svg{width:26px;height:26px;}
.sbtn:active{transform:scale(.95);}
.slabel{flex:1;min-height:54px;border-radius:14px;text-align:center;font-family:var(--display);font-weight:700;font-size:24px;}
.slabel small{display:block;font-family:'Archivo',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--now);font-weight:700;margin-top:3px;}
.slide-l{animation:slideL .24s ease;} .slide-r{animation:slideR .24s ease;}
@keyframes slideL{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.tcard{border-radius:14px;padding:10px;border:2px solid var(--rule);text-align:left;}
.tcard.on{border-color:var(--now);box-shadow:0 0 0 2px var(--now);}
.tprev{height:70px;border-radius:9px;padding:9px;display:flex;flex-direction:column;gap:6px;}
.tprev i{display:block;height:8px;border-radius:5px;}
.tcard span{display:block;font-weight:700;margin-top:8px;font-size:15px;}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0 4px;border-top:1px solid var(--rule);margin-top:16px;font-size:17px;}
.setrow small{display:block;font-size:13px;color:var(--chalk-faint);margin-top:3px;line-height:1.35;font-weight:400;}
.switch{width:58px;height:34px;border-radius:999px;background:var(--rule);position:relative;flex:0 0 auto;}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch.on{background:var(--ok);} .switch.on::after{left:27px;}
.view.stepview{flex-direction:column;gap:0;}
.view.stepview>.cols{flex:1 1 0;min-height:0;height:auto;}
.view.stepview>.stepper{flex:0 0 auto;width:100%;}
.view.stepview>.mbar,.view.stepview>.mhead{flex:0 0 auto;}
.view.stepview>.mgrid{flex:1 1 0;}
.mscard{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:52;pointer-events:none;text-align:center;font-family:var(--display);animation:msin 3.6s ease forwards;}
.mscard b{display:block;font-size:200px;line-height:.9;font-weight:800;color:#FFD83A;-webkit-text-stroke:6px #2A0A3A;paint-order:stroke fill;text-shadow:0 10px 0 rgba(0,0,0,.25);}
.mscard span{display:block;font-size:44px;font-weight:800;margin-top:10px;-webkit-text-stroke:5px #2A0A3A;paint-order:stroke fill;}
@keyframes msin{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1.05)}}
body.phone .mscard b{font-size:110px;}
body.shake main{animation:shake .5s cubic-bezier(.36,.07,.19,.97);}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(5px,-3px)}30%,50%,70%{transform:translate(-9px,4px)}40%,60%{transform:translate(9px,-4px)}}
.pcard.flash{animation:pflash .7s ease-out;}
@keyframes pflash{0%{box-shadow:none}15%{box-shadow:inset 0 0 0 5px var(--now),0 0 60px var(--now)}100%{box-shadow:inset 0 0 0 0 transparent,0 0 0 transparent}}

.spine{flex:1 1 auto;min-height:0;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:4px;display:flex;flex-direction:column;}
.evs{flex:0 0 auto;}
.pframe{display:none;flex:1 1 0;min-height:0;margin-top:14px;position:relative;border-radius:16px;overflow:hidden;background:var(--ink-2);}
.pframe.on{display:block;}
body.phone .pframe{display:none !important;}
html[data-theme="halloween"] .pframe,html[data-theme="christmas"] .pframe,html[data-theme="swansB"] .pframe{display:none !important;}
.pslide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease;}
.pslide.on{opacity:1;}
.pslide .pbg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(26px) brightness(.72) saturate(1.15);}
.pslide img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;}
.offscreen{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;}
.gbanner{display:none;align-items:center;gap:16px;background:#C8102E;color:#FFFFFF;border-radius:16px;padding:12px 18px 12px 14px;margin:0 0 10px;}
.gbanner.on{display:flex;}
.gbanner svg{flex:0 0 auto;width:74px;height:74px;background:#FFFFFF;border-radius:50%;padding:6px 14px 6px;box-sizing:border-box;}
.gbanner .gtx{flex:1 1 auto;min-width:0;}
.gbanner .gtag{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.14em;color:#FFE2E5;text-transform:uppercase;}
.gbanner .gteams{font-family:var(--display);font-weight:800;font-size:31px;line-height:1.08;margin-top:2px;}
.gbanner .gwhen{font-family:var(--display);font-weight:600;font-size:25px;color:#FFE2E5;margin-top:3px;}
.scene{display:none;flex:1 1 0;min-height:0;margin-top:auto;position:relative;}
html[data-theme="halloween"] .scene,html[data-theme="christmas"] .scene{display:block;}
body.phone .scene{display:none !important;}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:none;}
html[data-theme="halloween"] .scene .sc-hw,html[data-theme="christmas"] .scene .sc-xm
.anytime{border-bottom:1px solid var(--rule);padding-bottom:6px;margin-bottom:6px;}
.ev{display:flex;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid var(--rule);}
.ev[data-ev]{cursor:pointer;}
.ev[data-ev]:active{background:var(--ink-3);}
.anytime .ev:last-child{border-bottom:none;}
.ev .t{font-family:var(--display);font-weight:600;font-size:21px;font-variant-numeric:tabular-nums;color:var(--chalk-dim);min-width:92px;padding-top:2px;}
.anytime .ev .t{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-faint);padding-top:7px;}
.ev .body{flex:1;min-width:0;}
.ev .title{font-size:23px;font-weight:500;line-height:1.15;}
.who{font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;margin-top:4px;}
.amp{color:var(--chalk-faint);}
.ev.past{opacity:var(--past);}
.ev.past .title{text-decoration:line-through;text-decoration-thickness:1px;}
.ev.next{border-left:3px solid var(--now);padding-left:14px;margin-left:-17px;}
.ev.next .title{font-size:33px;font-weight:600;line-height:1.08;}
.ev.next .t{font-size:25px;color:var(--now);}
.ev.pending .title::after,.chip.pending .cx::after,.mev.pending::after{content:' ·';color:var(--now);}
.nowline{display:flex;align-items:center;gap:12px;margin:6px 0;}
.nowline .bar{flex:1;height:1px;background:var(--now);opacity:.55;}
.nowline .lbl{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--now);text-transform:uppercase;font-variant-numeric:tabular-nums;}

.rail{flex:1 1 40%;min-width:0;display:flex;flex-direction:column;gap:12px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.card{background:var(--ink-2);border-radius:14px;padding:14px 16px;position:relative;}
.card h2,.cardlink h2{font-size:24px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--chalk-faint);margin-bottom:10px;line-height:1.1;display:flex;align-items:center;gap:8px;}
.card h2 .count,.cardlink h2 .count{margin-left:auto;color:var(--chalk-dim);font-size:15px;letter-spacing:.02em;}
.chev{flex:0 0 auto;font-size:34px;line-height:.8;font-weight:500;letter-spacing:0;color:var(--chalk-faint);margin-left:-2px;}
.card h2[data-go],.cardlink h2[data-go]{cursor:pointer;padding:8px 0;margin:-8px 0 2px;}
.hplus{flex:0 0 auto;width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:var(--ink-3);color:var(--chalk);font-size:26px;line-height:1;letter-spacing:0;font-weight:500;}
.hplus:active{transform:scale(.92);}
.cardlink{display:block;width:100%;text-align:left;background:var(--ink-2);border-radius:14px;padding:14px 16px;cursor:pointer;}
.bow{display:none;position:absolute;left:150px;top:-22px;z-index:3;pointer-events:none;}
html[data-theme="christmas"] .bow{display:block;}
body.phone .bow{display:none !important;}

.row{display:flex;align-items:center;gap:12px;padding:9px 0;min-height:48px;border-bottom:1px solid var(--rule);width:100%;text-align:left;}
.row:last-child{border-bottom:none;}
.box{color:var(--ink);flex:0 0 auto;width:26px;height:26px;border-radius:7px;border:2px solid var(--chalk-faint);display:grid;place-items:center;}
.box svg{width:16px;height:16px;opacity:0;}
.row.done .box{background:var(--chalk-faint);}
.row.done .box svg{opacity:1;}
.row.shoprow{padding:0;gap:0;}
.shoprow .rowmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0;min-height:48px;padding:9px 0;text-align:left;}
.grip{flex:0 0 auto;width:54px;height:48px;display:grid;place-items:center;color:var(--chalk-faint);touch-action:none;cursor:grab;}
.grip svg{width:22px;height:22px;pointer-events:none;}
.shead{display:flex;align-items:center;gap:4px;padding:2px 0 2px;margin-top:16px;border-bottom:2px solid var(--now);}
.shead:first-child{margin-top:4px;}
.shead .stxt{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--now);overflow-wrap:anywhere;}
.shead .hb{flex:0 0 auto;width:46px;height:46px;border-radius:12px;font-size:26px;line-height:1;color:var(--chalk-dim);display:grid;place-items:center;}
.shead .hb:active{background:var(--ink-3);}
.srow-ghost{position:fixed;z-index:70;pointer-events:none;background:var(--ink-3);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.5);display:flex;align-items:center;padding:0 8px 0 16px;opacity:.97;}
.srow-ghost .grip{color:var(--now);}
.dropline{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:var(--now);pointer-events:none;z-index:5;}
.dragging{opacity:.22;}
#shopList{position:relative;}
.panel .ph #addHead{margin-left:auto;}
.panel .ph #clearBought{margin-left:8px;}
.row .txt{flex:1;font-size:17px;line-height:1.2;min-width:0;overflow-wrap:anywhere;}
.row.done .txt{opacity:.4;text-decoration:line-through;}
.tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;flex:0 0 auto;text-align:right;}
.grabs{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;flex:0 0 auto;background:var(--grabs);color:var(--grabstext);padding:5px 10px;border-radius:999px;}
.more{font-size:14px;color:var(--chalk-faint);padding-top:8px;}

.mini{display:flex;gap:10px;}
.mini .m{flex:1;background:var(--ink-3);border-radius:10px;padding:10px 12px;}
.mini .n{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;}
.mini .l{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:4px;}

/* ---------- week grids ---------- */
.cols{display:flex;gap:10px;width:100%;height:100%;}
.col{flex:1;min-width:0;background:var(--ink-2);border-radius:12px;padding:10px 10px 6px;display:flex;flex-direction:column;overflow:hidden;}
.col.today{background:var(--ink-3);box-shadow:inset 0 0 0 1px var(--rule);}
.col h3{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--chalk-faint);}
.col .num{font-family:var(--display);font-weight:700;font-size:27px;line-height:1;margin:2px 0 9px;}
.col.today .num{color:var(--now);}
.col .items{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.chip{display:block;width:100%;text-align:left;border-left:3px solid var(--chalk-faint);padding:5px 0 5px 8px;margin-bottom:7px;}
.chip .ct{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--chalk-dim);font-variant-numeric:tabular-nums;}
.chip .cx{font-size:15px;line-height:1.2;overflow-wrap:anywhere;}
.col .add{padding:8px 0 6px;font-size:24px;color:var(--chalk-faint);text-align:center;min-height:44px;width:100%;}

/* ---------- month ---------- */
#month{flex-direction:column;gap:0;}
.mbar{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.mbar h2{font-family:var(--display);font-weight:700;font-size:20px;min-width:0;}
.mbar .mnav{width:44px;height:40px;border-radius:10px;background:var(--ink-2);font-size:20px;color:var(--chalk-dim);}
.mbar .mtoday{margin-left:auto;padding:0 14px;height:40px;border-radius:999px;border:1px solid var(--rule);font-size:13px;font-weight:600;color:var(--chalk-dim);}
.mhead{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px;}
.mhead div{text-align:center;font-size:11px;font-weight:700;letter-spacing:.13em;color:var(--chalk-faint);}
.mgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cell{background:var(--ink-2);border-radius:9px;padding:6px 7px;display:flex;flex-direction:column;overflow:hidden;min-height:0;min-width:0;text-align:left;}
.cell.out{background:transparent;box-shadow:inset 0 0 0 1px var(--ink-2);}
.cell.out .cn{color:var(--chalk-faint);}
.cell.now{background:var(--ink-3);box-shadow:inset 0 0 0 1.5px var(--now);}
.cell.past .mev{opacity:.5;}
.cn{font-family:var(--display);font-weight:600;font-size:16px;line-height:1;margin-bottom:4px;}
.cell.now .cn{color:var(--now);}
.mev{display:block;font-size:12.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid var(--chalk-faint);padding-left:5px;margin-top:2px;}
.mev b{font-weight:700;color:var(--chalk-dim);font-variant-numeric:tabular-nums;}
.cell .mm{margin-top:auto;font-size:11.5px;font-weight:700;color:var(--chalk-faint);padding-top:2px;}

/* ---------- lists ---------- */
.panel{flex:1;min-width:0;background:var(--ink-2);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;}
.panel .ph{padding:14px 16px 4px;display:flex;align-items:baseline;gap:10px;}
.panel h2{font-family:var(--display);font-size:19px;font-weight:700;}
.panel .sub{font-size:12px;color:var(--chalk-faint);}
.panel .clear{margin-left:auto;font-size:13px;font-weight:600;color:var(--chalk-dim);padding:8px 12px;border-radius:999px;border:1px solid var(--rule);}
.newline{display:flex;align-items:center;gap:10px;margin:6px 16px 4px;padding:4px 14px;border-radius:12px;background:var(--ink-3);}
.newline input{flex:1;font-size:17px;min-height:48px;}
.newline input::placeholder{color:var(--chalk-faint);}
.newline button{font-weight:700;color:var(--now);padding:10px 4px;font-size:15px;}
.panel .chips{margin:6px 16px 4px;display:flex;gap:6px;flex-wrap:wrap;}
.panel .chips .wchip{padding:6px 12px;min-height:38px;font-size:14px;}
.panel .items{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 12px;}
#lists[data-only="shop"] #pTodo,#lists[data-only="todo"] #pShop{display:none;}

/* ---------- points ---------- */
#points{align-items:stretch;}
.pcard{flex:1;background:var(--ink-2);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;position:relative;overflow:hidden;}
.pcard .pname{font-family:var(--display);font-weight:700;font-size:26px;}
.pcard .score{font-family:var(--display);font-weight:800;font-size:150px;line-height:1;font-variant-numeric:tabular-nums;margin:auto 0;padding:10px 0;}
.pcard .score small{font-size:22px;font-weight:600;color:var(--chalk-faint);margin-left:10px;letter-spacing:.04em;}
.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1);}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
.pbtns{display:flex;gap:10px;}
.pbtns button{flex:1;height:72px;border-radius:16px;font-family:var(--display);font-weight:800;font-size:26px;color:var(--ink);}
.pbtns button:active{transform:scale(.96);}
.pfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.pfoot button{font-size:14px;font-weight:600;color:var(--chalk-faint);padding:10px 4px;min-height:44px;}
.pfoot .minus{font-family:var(--display);font-size:16px;}

/* ---------- sheets + modals ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-start;justify-content:center;padding-top:7vh;z-index:20;}
.scrim.on{display:flex;}
.sheet{width:min(680px,92vw);max-height:84vh;overflow-y:auto;background:var(--ink-2);border-radius:18px;padding:22px 24px 18px;box-shadow:0 24px 60px rgba(0,0,0,.5);}
.lead{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--chalk-faint);margin-bottom:10px;}
.dayl{margin:-4px 0 14px;}
.dayl .dr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:16px;}
.dayl .dr b{font-variant-numeric:tabular-nums;color:var(--chalk-dim);min-width:64px;font-weight:600;}
.dayl .dr span{flex:1;min-width:0;}
.dayl .dr .x{width:40px;height:36px;border-radius:9px;color:var(--chalk-faint);font-size:18px;}
.dayl .dr .conf{font-size:13px;font-weight:700;padding:8px 12px;border-radius:999px;}
.dayl .dr .conf.y{background:var(--danger);color:var(--dangertext);}
.dayl .dr .conf.n{color:var(--chalk-dim);}
.dayl .dr .rep{font-size:11px;color:var(--chalk-faint);letter-spacing:.08em;text-transform:uppercase;}
.daystep{display:flex;align-items:center;gap:8px;margin:-2px 0 14px;}
.daystep[hidden]{display:none;}
.daystep button{width:52px;height:44px;border-radius:12px;background:var(--ink-3);font-size:22px;color:var(--chalk-dim);}
.daystep .dl{flex:1;text-align:center;font-family:var(--display);font-weight:700;font-size:17px;}
.daystep .note{flex:1;font-size:13px;color:var(--chalk-dim);line-height:1.35;}
input.big:focus-visible{outline:none;border-bottom-color:var(--now);}
input.big{width:100%;font-size:29px;font-weight:500;border-bottom:2px solid var(--rule);padding-bottom:12px;}
input.big::placeholder,.field input::placeholder{color:var(--chalk-faint);}
.preview{font-size:15px;color:var(--now);margin-top:10px;min-height:20px;font-weight:600;}
.hint{font-size:13px;color:var(--chalk-faint);margin-top:6px;line-height:1.4;}
.whorow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.wchip{padding:9px 16px;border-radius:999px;font-size:15px;font-weight:600;border:1.5px solid var(--rule);color:var(--chalk-dim);min-height:44px;}
.wchip.on{color:var(--ink);}
.wchip.grabsc{border-color:var(--grabs);color:var(--chalk);}
.wchip.grabsc.on{background:var(--grabs);color:var(--grabstext);border-color:var(--grabs);font-weight:800;}
.acts{display:flex;gap:10px;margin-top:20px;align-items:center;}
.acts button{padding:13px 22px;border-radius:999px;font-size:16px;font-weight:700;min-height:48px;}
.cancel{color:var(--chalk-faint);}
.save{background:var(--btnbg);color:var(--btntext);margin-left:auto;padding:13px 30px;}
.danger{background:var(--danger);color:var(--dangertext);margin-left:auto;}
.delbtn{color:var(--danger);margin-left:auto;}
.delbtn.armed{background:var(--danger);color:var(--dangertext);}
.delbtn[hidden]{display:none;}
.delbtn + .save{margin-left:0;}
.mtitle{font-family:var(--display);font-size:22px;font-weight:700;margin-bottom:8px;}
.mtext{font-size:17px;color:var(--chalk-dim);line-height:1.45;}
.field{margin-top:14px;}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-faint);margin-bottom:6px;}
.field input{width:100%;font-size:16px;padding:12px 14px;background:var(--ink-3);border-radius:10px;}
.err{color:var(--danger);font-size:14px;margin-top:10px;min-height:18px;}
.stat{font-size:15px;color:var(--chalk-dim);line-height:1.7;}
.stat b{color:var(--chalk);}
.warnbox{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--ink-3);font-size:14px;line-height:1.4;color:var(--chalk);}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;pointer-events:none;
  background:var(--chalk);color:var(--ink);border-radius:999px;padding:8px 8px 8px 20px;display:flex;align-items:center;gap:14px;
  font-weight:600;font-size:16px;z-index:40;transition:transform .25s ease,opacity .25s ease;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.45);}
.toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto;}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.toast button{background:var(--ink);color:var(--chalk);border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;min-height:40px;}
.toast button[hidden]{display:none;}
.toast:not(:has(button:not([hidden]))){padding-right:20px;}

/* ---------- fx + night ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;}
#night{position:fixed;inset:0;background:#000;z-index:60;display:none;}
#night.on{display:block;}

/* ---------- seasonal animation ---------- */
.flk-a{animation:flkA 3.7s linear infinite;}
.flk-b{animation:flkB 2.9s linear infinite;}
@keyframes flkA{0%{opacity:.9}6%{opacity:.6}9%{opacity:.95}22%{opacity:.8}25%{opacity:.48}28%{opacity:.92}47%{opacity:.85}52%{opacity:.58}55%{opacity:.95}78%{opacity:.78}82%{opacity:.52}86%{opacity:.9}100%{opacity:.9}}
@keyframes flkB{0%{opacity:1}8%{opacity:.82}11%{opacity:1}30%{opacity:.9}34%{opacity:.74}37%{opacity:1}61%{opacity:.88}64%{opacity:.76}67%{opacity:1}90%{opacity:.86}93%{opacity:1}100%{opacity:1}}
.tstar,.spk{transform-box:fill-box;transform-origin:center;}
.tstar{animation:tstar 2.4s ease-in-out infinite;}
@keyframes tstar{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.spk{opacity:0;animation:spk 2.4s ease-in-out infinite;}
.spk2{animation-delay:1.2s;}
@keyframes spk{0%,55%,100%{opacity:0;transform:scale(.2) rotate(0deg)}72%{opacity:1;transform:scale(1.1) rotate(45deg)}}
body.night .flk-a,body.night .flk-b,body.night .tstar,body.night .spk{animation-play-state:paused;}

/* ---------- elf ---------- */
#elf{position:fixed;z-index:9;display:none;padding:0;line-height:0;touch-action:manipulation;transition:opacity .18s ease,transform .18s ease;}
#elf.on{display:block;}
#elf.vanish{opacity:0;transform:scale(.4) !important;}
#elf svg{display:block;}
.elfsay{position:fixed;z-index:55;pointer-events:none;background:#fff;color:#A81C2B;font-family:'Mountains of Christmas','Archivo',sans-serif;font-weight:700;font-size:26px;padding:8px 16px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.3);white-space:nowrap;animation:elfsay 1.7s ease forwards;}
.elfsay::after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0;}
@keyframes elfsay{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}12%{opacity:1;transform:translate(-50%,0) scale(1.08)}22%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}

/* ---------- phone ---------- */
.pnav{display:none;}
body.phone{--pad:14px;}
body.phone .top{padding-top:10px;}
body.phone .datestamp{font-size:18px;overflow:hidden;text-overflow:ellipsis;min-width:0;}
html[data-theme="halloween"] body.phone .datestamp,html[data-theme="christmas"] body.phone .datestamp{font-size:22px;}
body.phone .topr{gap:0;}
body.phone .iconbtn{width:40px;}
.newline input:focus-visible{outline:none;}
.newline:focus-within{box-shadow:inset 0 0 0 2px var(--now);}
body.phone .clock,body.phone nav,body.phone .rail,body.phone .addbtn{display:none;}
body.phone main{padding-bottom:8px;}
body.phone .pnav{display:flex;border-top:1px solid var(--rule);padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--ink);}
body.phone .pnav button{flex:1;min-height:52px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--chalk-faint);border-radius:12px;}
body.phone .pnav button.on{color:var(--ink);background:var(--chalk);}
body.phone #points{flex-direction:column;}
body.phone .pcard{padding:16px 18px;}
body.phone .pcard .score{font-size:84px;padding:4px 0;}
body.phone .pbtns button{height:56px;font-size:21px;}
body.phone .ev .title{font-size:19px;}
body.phone .ev.next .title{font-size:24px;}
body.phone .ev .t{min-width:70px;font-size:17px;}
body.phone .panel{border-radius:12px;}
body.phone .themes{grid-template-columns:repeat(2,1fr);}

body.phone #week.stepview>.cols{height:auto;}
body.phone .stepper{padding-top:8px;}
::-webkit-scrollbar{width:0;height:0;}
@media (prefers-reduced-motion:reduce){.mscard{animation:none;}.bump,.slide-l,.slide-r,.pcard.flash,body.shake main,.flk-a,.flk-b,.tstar,.spk,.elfsay{animation:none;}.toast,#elf{transition:none;}.spk{opacity:0;}.elfsay{opacity:1;}}
</style>

<script>
'use strict';
/* =====================================================================
   Family Planner v2
   Data: Google Apps Script backend (Calendar + Sheet), or demo mode.
   Changes are applied instantly on screen, queued, and sent in batches.
   If there's no signal, they wait and go when it's back.
   ===================================================================== */

/*PURE-START*/
/* ---------------- household ---------------- */
const PEOPLE = [
  {name:'Darren', color:'#54B6DC'},
  {name:'Naomi',  color:'#EC7099'},
  {name:'Maddy',  color:'#A9D84E'},
  {name:'Ava',    color:'#B69CFF'}
];
const NAMES = PEOPLE.map(p=>p.name);
const EVERYONE = {name:'Everyone', color:'#F1EDE2'};

/* ---------------- dates ---------------- */
const pad = n => String(n).padStart(2,'0');
const DOW  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW3 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const mondayOf = d => addDays(d, -((d.getDay()+6)%7));
const hm = d => pad(d.getHours())+':'+pad(d.getMinutes());
const daysBetween = (a, b) => Math.round((b - a) / 864e5);
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
function pretty(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  let hh = h % 12; if(hh===0) hh = 12;
  return (m ? hh+'.'+pad(m) : hh) + (h < 12 ? 'am' : 'pm');
}
function dayLabel(ds){
  const d = fromIso(ds), t = today();
  if(ds === iso(t)) return 'Today';
  if(ds === iso(addDays(t,1))) return 'Tomorrow';
  return DOW3[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()].slice(0,3);
}

/* ---------------- people tags ---------------- */
// who is always an array of names in household order, ['Everyone'], or null.
const NM = '(?:'+NAMES.join('|')+')';
const NAME_RE = new RegExp('^\\s*(everyone|family|'+NM+'(?:\\s*(?:,|&|\\+|\\band\\b)\\s*'+NM+')*)(?![\\w\\u2019\'])\\s*[:,\\-\\u2013\\u2014]?\\s*', 'i');
function whoOf(text){
  const s = String(text), m = s.match(NAME_RE);
  if(!m) return {who:null, rest:s};
  const n = m[1].toLowerCase();
  let who;
  if(n==='everyone' || n==='family') who = ['Everyone'];
  else { const set = n.split(/\s*(?:,|&|\+|\band\b)\s*/); who = NAMES.filter(x=>set.indexOf(x.toLowerCase())>=0); }
  const rest = s.slice(m[0].length).trim();
  return {who, rest: rest || s};
}
function whoNames(who){
  if(!who) return [];
  const a = Array.isArray(who) ? who : String(who).split(',');
  return a.map(x=>String(x).trim()).filter(Boolean);
}
function joinNames(a){
  a = whoNames(a);
  if(a.length <= 1) return a[0] || '';
  return a.slice(0,-1).join(', ') + ' & ' + a[a.length-1];
}
function composeTitle(who, title){ const n = whoNames(who); return (n.length ? joinNames(n)+': ' : '') + title; }

const GRABS_RE = /^\s*(?:(?:up\s*for\s*grabs|grabs)\b\s*[:,\-–—]?|anyone\s*[:,\-–—])\s*/i;
function parseTodo(raw){
  const s = String(raw).trim(), g = s.match(GRABS_RE);
  if(g){ const rest = s.slice(g[0].length).trim(); return {who:null, grabs:true, text:cap(rest || s)}; }
  const w = whoOf(s);
  const names = (w.who && w.who[0] !== 'Everyone') ? w.who : null;
  return {who:names, grabs:false, text:cap(w.who ? w.rest : s)};
}

const DAY_WORDS = {sunday:0,monday:1,mon:1,tuesday:2,tue:2,tues:2,wednesday:3,wed:3,thursday:4,thu:4,thur:4,thurs:4,friday:5,fri:5,saturday:6,sat:6};
function parseEvent(raw, baseDate, opts){
  const noDate = !!(opts && opts.noDate);
  let text = ' ' + raw.trim() + ' ';
  let time = null, date = baseDate, dateSet = false;

  // time: 4pm, 4.30pm, 4:30 pm, 16:00 (optionally preceded by "at")
  let m = text.match(/\s(?:at\s+)?(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)(?=[\s,.!?]|$)/i);
  if(m){
    let h = parseInt(m[1],10), mi = m[2] ? parseInt(m[2],10) : 0;
    if(h>=1 && h<=12 && mi<60){
      h = h % 12; if(m[3].toLowerCase()==='pm') h += 12;
      time = pad(h)+':'+pad(mi);
      text = text.slice(0,m.index) + ' ' + text.slice(m.index+m[0].length);
    }
  } else {
    m = text.match(/\s(?:at\s+)?([01]?\d|2[0-3]):([0-5]\d)(?=[\s,.!?]|$)/);
    if(m){ time = pad(parseInt(m[1],10))+':'+m[2]; text = text.slice(0,m.index) + ' ' + text.slice(m.index+m[0].length); }
  }

  if(!noDate){
    // date: dd/mm or dd/mm/yy(yy)
    m = text.match(/\s(?:on\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=[\s,.!?]|$)/);
    if(m){
      const d = parseInt(m[1],10), mo = parseInt(m[2],10);
      let y = m[3] ? parseInt(m[3],10) : today().getFullYear();
      if(y < 100) y += 2000;
      let cand = new Date(y, mo-1, d);
      if(cand.getMonth()===mo-1 && cand.getDate()===d){
        if(!m[3] && cand < addDays(today(), -30)) cand = new Date(y+1, mo-1, d);
        date = iso(cand); dateSet = true;
        text = text.slice(0,m.index) + ' ' + text.slice(m.index+m[0].length);
      }
    }
    if(!dateSet){
      m = text.match(/\s(?:(?:on|this|next)\s+)?(today|tonight|tomorrow|tmrw|tomoz|sunday|monday|mon|tuesday|tues|tue|wednesday|wed|thursday|thurs|thur|thu|friday|fri|saturday|sat)(?=[\s,.!?]|$)/i);
      if(m){
        const w = m[1].toLowerCase(), t = today();
        if(w==='today' || w==='tonight') date = iso(t);
        else if(w==='tomorrow' || w==='tmrw' || w==='tomoz') date = iso(addDays(t,1));
        else { const target = DAY_WORDS[w]; date = iso(addDays(t, (target - t.getDay() + 7) % 7)); }
        dateSet = true;
        text = text.slice(0,m.index) + ' ' + text.slice(m.index+m[0].length);
      }
    }
  }

  text = text.replace(/\s{2,}/g,' ').trim().replace(/^[\-–—,:\s]+|[\-–—,:\s]+$/g,'');
  const w = whoOf(text);
  return {title: cap(w.who ? w.rest : text), who: w.who, time, date, dateSet};
}

// Halloween 24-31 Oct, Christmas 1-31 Dec (both inclusive). Back to normal on 1 Nov / 1 Jan.
function seasonOf(d){
  const m = d.getMonth(), day = d.getDate();
  if(m === 9 && day >= 24) return 'halloween';
  if(m === 11) return 'christmas';
  return null;
}
const SEASON_ENDS = {halloween:'1 November', christmas:'1 January'};
function nextOn(m, d, from){ let t = new Date(from.getFullYear(), m, d); if(t < from) t = new Date(from.getFullYear()+1, m, d); return t; }
function sleepsText(n){ return n === 1 ? '1 sleep' : n + ' sleeps'; }
// What the scene counter should say, for "halloween" or "christmas".
function countdown(kind, now){
  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if(kind === 'halloween'){
    const n = daysBetween(t0, nextOn(9, 31, t0));
    return n === 0 ? {day:true, big:'Happy', small:'Halloween!'} : {n, big:sleepsText(n), small:'till Halloween'};
  }
  if(t0.getMonth() === 11 && t0.getDate() === 25) return {day:true, big:'Merry', small:'Christmas!'};
  if(t0.getMonth() === 11 && t0.getDate() > 25){
    const n = daysBetween(t0, new Date(t0.getFullYear()+1, 0, 1));
    return {n, big:sleepsText(n), small:'till New Year'};
  }
  const n = daysBetween(t0, nextOn(11, 25, t0));
  return {n, big:sleepsText(n), small:'till Christmas'};
}

const ELF_HOUR = 6;
function elfDayKey(d){ return iso(new Date((d || new Date()).getTime() - ELF_HOUR*3600*1000)); }
function hash(s){ let h = 2166136261; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
// Same hiding spot all day, a different one tomorrow (never the same two days running).
function elfIndex(key, count){
  const prev = iso(addDays(fromIso(key), -1));
  let i = hash('elf'+key) % count;
  if(i === hash('elf'+prev) % count) i = (i + 1) % count;
  return i;
}
// Active 1-24 December (he goes home on Christmas Eve).
function elfActiveOn(key){ const p = key.split('-').map(Number); return p[1] === 12 && p[2] >= 1 && p[2] <= 24; }

function setEventTime(ev, op){
  if(op.time){

// ids first, in the order given; anything not mentioned keeps its place after them.
function reorderList(list, ids){
  const by = {}; list.forEach(i=>{ by[i.id] = i; });
  const seen = {}, out = [];
  (ids || []).forEach(id=>{ if(by[id] && !seen[id]){ seen[id] = 1; out.push(by[id]); } });
  list.forEach(i=>{ if(!seen[i.id]) out.push(i); });

}
function applyLocal(s, op){
  switch(op.type){
    case 'shop.add': if(!s.shopping.some(i=>i.id===op.id)){ const it = {id:op.id, text:op.text, bought:false}; if(op.head) it.kind = 'head'; s.shopping.push(it); } break;
    case 'shop.order': s.shopping = reorderList(s.shopping, op.ids); break;
    case 'shop.bought': s.shopping.forEach(i=>{ if(i.id===op.id) i.bought = op.bought; }); break;
    case 'shop.remove': s.shopping = s.shopping.filter(i=>i.id!==op.id); break;
    case 'shop.clear': s.shopping = s.shopping.filter(i=>!i.bought); break;
    case 'todo.add': if(!s.todos.some(i=>i.id===op.id)) s.todos.push({id:op.id, text:op.text, who:op.who||null, grabs:!!op.grabs}); break;
    case 'todo.done': s.todos = s.todos.filter(i=>i.id!==op.id); break;

/* ---------------- transport ---------------- */
async function transport(payload){
  if(cfg.url === 'demo') return demoServer(payload);
  const ctrl = ('AbortController' in window) ? new AbortController() : null;
  const timer = setTimeout(()=>ctrl && ctrl.abort(), 25000);
  try{
    // Plain string body = text/plain = no CORS preflight, which Apps Script can't answer.
    const r = await fetch(cfg.url, {method:'POST', body:JSON.stringify(payload), redirect:'follow', signal: ctrl ? ctrl.signal : undefined});
    const txt = await r.text();
    try{ return JSON.parse(txt); }
    catch(e){ throw new Error(r.ok ? 'Unexpected reply. Check the script is deployed with access set to Anyone.' : 'HTTP '+r.status); }
  } finally { clearTimeout(timer); }
}

function neededRange(){
  const t = today();
  const g = monthGrid(monthOffset);
  const vd = addDays(t, dayOffset);
  const ws = weekSpan();
  let s = [g.start, mondayOf(t), addDays(t,-1), vd, ws[0]].reduce((a,b)=>a<b?a:b);
  let e = [addDays(g.end,1), addDays(t,16), addDays(vd,1), ws[1]].reduce((a,b)=>a>b?a:b);
  return [iso(s), iso(e)];
}

// Ops an out-of-date (v1) script would mangle or silently drop. They wait until the script says it is v2.
const needsV2 = op => op.type === 'event.edit' || (op.type === 'todo.add' && (op.grabs || String(op.who||'').indexOf(',') >= 0));
// Which script version each change needs. Changes wait on the device until the script is new enough.
const opNeeds = op => (op.type === 'shop.order' || (op.type === 'shop.add' && op.head)) ? 3 : (needsV2(op) ? 2 : 1);

let syncTimer = null;
function scheduleSync(ms){ clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }

async function sync(){
  if(!cfg || syncing) return;
  syncing = true; drawStatus();
  const ver = server.version || 1;
  const ops = outbox.filter(o=>ver >= opNeeds(o)).slice(0, 40);
  const [start, end] = neededRange();
  let again = false;
  try{
    const res = await transport({k:cfg.k, ops, start, end});
    if(!res || !res.ok) throw new Error((res && res.error) || 'No reply');
    const done = new Set(res.applied || []), rejected = new Set(res.rejected || []);
    outbox = outbox.filter(o=>!done.has(o.opId) && !rejected.has(o.opId));
    store.set('fp.outbox', outbox);
    server = {events:res.events||[], shopping:res.shopping||[], todos:res.todos||[], points:res.points||{}, games:Array.isArray(res.games)?res.games:[], range:[start,end], version:res.version||1};
    store.set('fp.server', server);
    lastOk = Date.now(); store.set('fp.lastOk', lastOk);
    lastErr = null;
    if(rejected.size) lastErr = 'The Google script didn’t understand '+rejected.size+' change'+(rejected.size===1?'':'s')+'. Redeploy Code.gs from the setup guide.';
    else if(outbox.some(o=>opNeeds(o) > server.version)) lastErr = 'The Google script is out of date, so some changes are waiting. Redeploy Code.gs from the setup guide.';
    again = outbox.some(o=>server.version >= opNeeds(o));
  }catch(e){
    lastErr = (e && e.name === 'AbortError') ? 'Timed out' : ((e && e.message) || 'Could not connect');
  }
  syncing = false;
  applyTheme(); rebuild(); renderAll();
  if(again) scheduleSync(300);
  else if(lastErr && outbox.length) scheduleSync(15000);
}

    events:db.ev, shopping:db.shopping, todos:db.todos.filter(t=>!t.done), points:pts}), 250));
}

/* ---------------- event bucketing ---------------- */
function bucketEvents(events){
  const map = {};
  const push = (ds, it) => { (map[ds] || (map[ds] = [])).push(it); };
  events.forEach(ev=>{
    const w = whoOf(ev.title || '(No title)');
    const base = {id:ev.id, rec:!!ev.rec, pending:!!ev.pending, title:w.who ? cap(w.rest) : (ev.title||'(No title)'), who:w.who};
    if(ev.allDay){
      let d = fromIso(ev.sd); const end = fromIso(ev.ed); let g = 0;
      do { push(iso(d), Object.assign({}, base, {time:null, key:ev.id+'|'+iso(d)})); d = addDays(d,1); } while(d < end && ++g < 62);
    } else {
      const s = new Date(ev.s);
      push(iso(s), Object.assign({}, base, {time:hm(s), sMs:ev.s, eMs:ev.e, key:ev.id+'|'+ev.s}));
      let d = addDays(s,1), g = 0;
      while(d.getTime() < ev.e && ++g < 62){ push(iso(d), Object.assign({}, base, {time:null, cont:true, key:ev.id+'|'+ev.s+'|'+iso(d)})); d = addDays(d,1); }
    }
  });
  Object.keys(map).forEach(k=>map[k].sort((a,b)=>{
    if(a.time===null && b.time===null) return 0;
    if(a.time===null) return -1;
    if(b.time===null) return 1;
    return a.sMs - b.sMs;
  }));
  return map;
}

// Weeks: one offset shared by Weekdays, Weekend and 7 days. From Saturday, Weekdays rolls on to next week.
let weekOffset = 0;
function weekBases(){
  const t = today(), m = mondayOf(t), wd = t.getDay();
  return {
    work: addDays(wd === 0 || wd === 6 ? addDays(m,7) : m, weekOffset*7),
    wknd: addDays(addDays(m,5), weekOffset*7),
    week: addDays(t, weekOffset*7)
  };
}
function weekSpan(){
  const b = weekBases(), all = [b.work, b.wknd, b.week];
  const lo = all.reduce((a,c)=>a<c?a:c), hi = all.reduce((a,c)=>a>c?a:c);
  return [lo, addDays(hi, 7)];
}
const WEEK_LEN = {work:5, wknd:2, week:7};
function rangeText(a, b){
  const m1 = MON[a.getMonth()].slice(0,3), m2 = MON[b.getMonth()].slice(0,3);
  return a.getMonth() === b.getMonth() ? a.getDate()+' – '+b.getDate()+' '+m2 : a.getDate()+' '+m1+' – '+b.getDate()+' '+m2;
}
function weekRel(start){
  const n = Math.round((mondayOf(start) - mondayOf(today())) / (7*864e5));
  if(n === 0) return 'This week'; if(n === 1) return 'Next week'; if(n === -1) return 'Last week';
  return n > 0 ? 'In '+n+' weeks' : (-n)+' weeks ago';
}

// Adds items to the end of the list, or to the end of one sub-head's section if `section` is given.
function addShopText(raw, section){
  const ids = [];
  raw.split(/,|\n/).map(x=>x.trim()).filter(Boolean).forEach(text=>{
    const id = uid(); ids.push(id);
    enqueue({type:'shop.add', id, text:cap(text)});

  if(!section || !ids.length) return;
  const order = view.shopping.map(i=>i.id).filter(x=>ids.indexOf(x) < 0);
  let at = order.indexOf(section); if(at < 0) return;
  at++;
  while(at < order.length){ const it = view.shopping.find(i=>i.id === order[at]); if(!it || it.kind === 'head') break; at++; }
  order.splice.apply(order, [at, 0].concat(ids));

}

/* ---- drag to reorder (shopping). A sub-head carries the items under it. ---- */
$('shopList').addEventListener('pointerdown', e=>{
  const g = e.target.closest('[data-grip]'); if(!g || drag) return;
  e.preventDefault(); startDrag(e, g);
});
function startDrag(e, grip){
  const list = $('shopList'), row = grip.closest('[data-sid]'); if(!row) return;
  const items = view.shopping, ids = items.map(i=>i.id), idx = ids.indexOf(row.dataset.sid); if(idx < 0) return;
  const isHead = items[idx].kind === 'head';
  let end = idx + 1; if(isHead) while(end < items.length && items[end].kind !== 'head') end++;
  const group = ids.slice(idx, end);
  const all = Array.prototype.slice.call(list.querySelectorAll('[data-sid]'));
  const groupEls = all.filter(el=>group.indexOf(el.dataset.sid) >= 0), rest = all.filter(el=>group.indexOf(el.dataset.sid) < 0);
  const rr = row.getBoundingClientRect();
  const ghost = row.cloneNode(true); ghost.classList.add('srow-ghost');
  ghost.style.cssText = 'left:'+rr.left+'px;top:'+rr.top+'px;width:'+rr.width+'px;height:'+rr.height+'px;';
  if(group.length > 1){ const n = document.createElement('div'); n.style.cssText = 'font-size:13px;color:var(--chalk-dim);margin-left:8px;white-space:nowrap'; n.textContent = '+ '+(group.length-1)+' item'+(group.length > 2 ? 's' : ''); ghost.insertBefore(n, ghost.querySelector('.grip')); }
  document.body.appendChild(ghost);
  groupEls.forEach(el=>el.classList.add('dragging'));
  const line = document.createElement('div'); line.className = 'dropline'; list.appendChild(line);
  drag = {pid:e.pointerId, y:e.clientY, off:e.clientY - rr.top, h:rr.height, ghost, line, rest, group, isHead, before:null, raf:0, grip};
  try{ grip.setPointerCapture(e.pointerId); }catch(err){}
  grip.addEventListener('pointermove', onDragMove); grip.addEventListener('pointerup', onDragEnd); grip.addEventListener('pointercancel', onDragEnd);
  moveDrag(e.clientY);
  drag.raf = requestAnimationFrame(dragLoop);
}
function onDragMove(e){ if(drag) drag.y = e.clientY; moveDrag(e.clientY); }
function dragLoop(){
  if(!drag) return;
  const lr = $('shopList').getBoundingClientRect();
  if(drag.y < lr.top + 56) $('shopList').scrollTop -= 14; else if(drag.y > lr.bottom - 56) $('shopList').scrollTop += 14;
  moveDrag(drag.y);
  drag.raf = requestAnimationFrame(dragLoop);
}
function moveDrag(y){
  const d = drag; if(!d) return;
  d.ghost.style.top = (y - d.off)+'px';
  const list = $('shopList'), lr = list.getBoundingClientRect();
  const cands = d.isHead ? d.rest.filter((el,i)=>i === 0 || el.classList.contains('shead')) : d.rest;
  let before = null;
  for(let i=0;i<cands.length;i++){ const r = cands[i].getBoundingClientRect(); if(y < r.top + r.height/2){ before = cands[i]; break; } }
  d.before = before;
  let top;
  if(before) top = before.getBoundingClientRect().top;
  else { const last = d.rest[d.rest.length-1]; top = last ? last.getBoundingClientRect().bottom : lr.top; }
  d.line.style.top = (top - lr.top + list.scrollTop - 2)+'px';
}
function onDragEnd(e){
  const d = drag; if(!d) return;
  cancelAnimationFrame(d.raf);
  d.grip.removeEventListener('pointermove', onDragMove); d.grip.removeEventListener('pointerup', onDragEnd); d.grip.removeEventListener('pointercancel', onDragEnd);
  try{ d.grip.releasePointerCapture(d.pid); }catch(err){}
  d.ghost.remove(); d.line.remove();
  const before = d.before, canceled = e && e.type === 'pointercancel';
  const restIds = d.rest.map(el=>el.dataset.sid);
  const at = before ? restIds.indexOf(before.dataset.sid) : restIds.length;
  const next = restIds.slice(0, at).concat(d.group, restIds.slice(at));
  const was = view.shopping.map(i=>i.id);
  drag = null;
  if(!canceled && next.join('|') !== was.join('|')){ enqueue({type:'shop.order', ids:next}); sound.tick(); }
  else renderLists();
  if(pendingLists){ pendingLists = false; renderLists(); }
}

/* ---------------- status + setup ---------------- */
function ago(ms){
  if(!ms) return 'never';
  const s = Math.round((Date.now()-ms)/1000);
  if(s < 60) return 'just now';
  if(s < 3600) return Math.round(s/60)+' min ago';
  return new Date(ms).toLocaleString('en-AU', {weekday:'short', hour:'numeric', minute:'2-digit'});
}
$('statusBtn').onclick = ()=>{
  if(!cfg){ setupScreen(false); return; }
  openModal(
    '<div class="mtitle">Sync</div><div class="stat">'+
    'Connected to: <b>'+(cfg.url==='demo' ? 'Demo (not real data)' : 'Google')+'</b><br>'+
    'Script version: <b>'+(server.version || 1)+'</b>'+((server.version||1) < SCRIPT_VERSION_NEEDED ? ' <span style="color:var(--danger)">(needs 3)</span>' : '')+'<br>'+
    'Last synced: <b>'+ago(lastOk)+'</b><br>'+
    'Changes waiting to send: <b>'+outbox.length+'</b>'+
    (lastErr ? '<br>Problem: <b style="color:var(--danger)">'+esc(lastErr)+'</b>' : '')+
    '</div><div class="acts"><button class="cancel" id="reconnect">Change connection</button><button class="save" id="syncNow">Sync now</button></div>');
  $('syncNow').onclick = ()=>{ closeModal(); sync(); };
  $('reconnect').onclick = ()=>setupScreen(true);
};

function setupScreen(changing){
  openModal(
    '<div class="mtitle">Connect the planner</div>'+
    '<div class="mtext">Paste the web app URL and the secret from the setup guide.</div>'+
    '<div class="field"><label>Web app URL</label><input id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" autocapitalize="off" spellcheck="false"></div>'+
    '<div class="field"><label>Secret</label><input id="cfgKey" autocomplete="off" autocapitalize="off" spellcheck="false"></div>'+
    '<div class="err" id="cfgErr"></div>'+
    '<div class="acts">'+(changing ? '<button class="cancel" data-close>Cancel</button>' : '<button class="cancel" id="tryDemo">Try demo</button>')+
    '<button class="save" id="cfgSave">Connect</button></div>');
  if(cfg && cfg.url !== 'demo'){ $('cfgUrl').value = cfg.url; $('cfgKey').value = cfg.k; }
  if($('tryDemo')) $('tryDemo').onclick = ()=>connect({url:'demo', k:'demo'});
  $('cfgSave').onclick = ()=>{
    const url = $('cfgUrl').value.trim(), k = $('cfgKey').value.trim();
    if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){ $('cfgErr').textContent = 'That doesn’t look like an Apps Script web app URL (it should end in /exec).'; return; }
    if(!k){ $('cfgErr').textContent = 'The secret is missing.'; return; }
    connect({url, k});
  };
}
async function connect(next){
  const prev = cfg; cfg = next;
  if($('cfgErr')) $('cfgErr').textContent = 'Connecting…';
  try{
    const [start,end] = neededRange();
    const res = await transport({k:cfg.k, ops:[], start, end});
    if(!res || !res.ok) throw new Error((res && res.error) || 'No reply');
    if(!prev || prev.url !== next.url){ outbox = []; store.set('fp.outbox', outbox); server = {events:[], shopping:[], todos:[], points:{}}; }
    store.set('fp.cfg', cfg);
    closeModal(); sync();
  }catch(e){
    cfg = prev;
    if($('cfgErr')) $('cfgErr').textContent = 'Couldn’t connect: '+((e && e.message) || 'unknown error');
  }
}

// One canvas over everything. Everything is drawn in code, in a flat cel-shaded "anime" style:

const rnd = (a,b) => a + Math.random()*(b-a);

// Points: two confetti cannons from the bottom corners, plus a pop at the button.

function celebrate(x, y, who, power){
  const H = innerHeight, W = innerWidth, k = H/810;

  let n = reduced ? 40 : Math.round((420 + power*220) * fxQ);
  n = Math.min(n, room());
  for(let i=0;i<n;i++){
    const left = i % 2 === 0;
    const a = -Math.PI/2 + (left ? 1 : -1) * rnd(0.22, 0.75);
    const v = rnd(17, 31) * k * (power >= 8 ? 1.12 : 1);
    parts.push({k:'c', x: left ? rnd(-10,20) : W - rnd(-10,20), y: H + 8,
      vx: Math.cos(a)*v, vy: Math.sin(a)*v, delay: Math.floor(rnd(0, 14)),
      w: rnd(9,17)*k, h: rnd(5,9)*k, rot: rnd(0,6.3), vr: rnd(-0.3,0.3),
      term: rnd(2.2,4.2)*k, sway: rnd(0.8,2.2), ph: rnd(0,6.3), life: 1, color: colors[i % colors.length]});
  }

  for(let i=0;i<top;i++){
    parts.push({k:'c', x:rnd(0,W), y:-rnd(10,160), vx:rnd(-1.2,1.2), vy:rnd(1,4)*k, delay:Math.floor(rnd(0,40)),

  }

  }

// To Do done: an anime-style mushroom cloud that fills the screen, plus a big screen shake.
// Drawn in the spirit of a black-ink engraving (bubbly cauliflower cap, hatched stem, spiky ground burst), coloured in flat cel bands.
const INK = '#240808';
const hexOf = a => '#' + a.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
const rgbOf = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function mixHex(a, b, t){ const A = rgbOf(a), B = rgbOf(b); return hexOf(A.map((v,i)=>v + (B[i]-v)*t)); }
function ramp(stops, t){ t = Math.max(0, Math.min(1, t)); const n = stops.length-1, i = Math.min(n-1, Math.floor(t*n)); return mixHex(stops[i], stops[i+1], t*n - i); }
// The cloud cools over its life: white-hot, then yellow, orange, red, and finally dark brown, with pale dust round the base.
const CAP_RAMP = ['#2E100D','#6B1B12','#C23216','#F2641A','#FFB52E','#FFE98A','#FFFBEA'];
const clamp01 = v => Math.max(0, Math.min(1, v));
function heatCols(h){ const base = ramp(CAP_RAMP, clamp01(h)); return {base, hi:mixHex(base, '#FFF6D0', .38), sh:mixHex(base, '#2A0806', .45)}; }
function dustCols(c, k){ return {base:mixHex(c.base, '#CDAA80', k), hi:mixHex(c.hi, '#F1DDBB', k), sh:mixHex(c.sh, '#8E6B47', k)}; }
function mkLobe(px, py, sz, lv){ return {px, py, sz, lv, ph:rnd(0,TAU), hs:Math.random()}; }
function buildCloud(){
  // Each mass is the UNION of many overlapping circles of mixed size, filled as ONE shape.
  // Only the scalloped edge shows, like a cauliflower, so it reads as one billowing cloud, not a pile of balls.
  const cap = [], inner = [], stem = [], base = [], spikes = [], hatch = [], horns = [];
  const N = 26;
  for(let i=0;i<N;i++){
    const a = -.42 + (Math.PI + .84)*(i/(N-1)), top = Math.max(0, Math.sin(a)), R = rnd(.84,.97);
    cap.push({px:Math.cos(a)*R*1.04, py:-Math.sin(a)*R*.74, r:rnd(.10,.16) + top*rnd(.02,.07), ph:rnd(0,TAU)});
  }
  [[0,-.32,.44],[-.42,-.26,.36],[.42,-.26,.36],[0,-.56,.32],[-.68,-.1,.26],[.68,-.1,.26]].forEach(f=>cap.push({px:f[0], py:f[1], r:f[2], ph:rnd(0,TAU)}));
  for(let i=0;i<7;i++) cap.push({px:-.72 + 1.44*(i/6) + rnd(-.05,.05), py:rnd(.05,.15), r:rnd(.09,.14), ph:rnd(0,TAU)});   // lumpy underside
  for(let i=0;i<9;i++){
    const a = rnd(.05, Math.PI-.05), rr = rnd(.3,.7);
    inner.push({px:Math.cos(a)*rr, py:-Math.sin(a)*rr*.7 - .02, r:rnd(.16,.26), ph:rnd(0,TAU), a0:rnd(.05,.4)*Math.PI, a1:0});

  for(let i=0;i<M;i++){
    const t = i/(M-1), prof = t < .5 ? .34 - .19*(t/.5) : .15 + .07*((t-.5)/.5);
    stem.push({t, px:rnd(-.015,.015), r:prof*rnd(.93,1.07), ph:rnd(0,TAU)});
  }
  for(let i=0;i<9;i++) base.push({xf:-.95 + 1.9*(i/8) + rnd(-.04,.04), r:rnd(58,98), up:rnd(.3,.55), ph:rnd(0,TAU)});
  for(let i=0;i<5;i++) base.push({xf:rnd(-.6,.6), r:rnd(40,68), up:rnd(.95,1.3), ph:rnd(0,TAU)});
  for(let i=0;i<10;i++) spikes.push({dir:i%2 ? 1 : -1, a:rnd(.14,1.1), len:rnd(.3,.62), w:rnd(.032,.06), off:rnd(20,140)});
  for(let i=0;i<4;i++) horns.push({dir:i%2 ? 1 : -1, len:rnd(.2,.34), up:rnd(.12,.26), w:rnd(.012,.02), off:rnd(70,170)});
  for(let i=0;i<14;i++) hatch.push({f:rnd(-1,1), len:rnd(.45,1)});

// one filled shape from many circles
function unionPath(list, f){
  const P = new Path2D();
  list.forEach(c=>{ const o = f(c); P.moveTo(o.x + o.r, o.y); P.arc(o.x, o.y, o.r, 0, TAU); });
  return P;
}
// ink outline, then flat colour bands (each band a shrunk, shifted copy of the same shape, clipped inside it)
function paintMass(g, path, lw, cx0, cy0, cols, specs){
  g.lineWidth = lw*2; g.strokeStyle = INK; g.stroke(path);
  g.save(); g.clip(path);
  g.fillStyle = cols[0]; g.fill(path);
  specs.forEach((sp, i)=>{
    g.save(); g.translate(cx0 + sp.dx, cy0 + sp.dy); g.scale(sp.sx, sp.sy); g.translate(-cx0, -cy0);
    g.fillStyle = cols[i+1]; g.fill(path); g.restore();
  });

}
function paintCloud(g, p, now, u){
  const hot = u < .1 ? 1 : 1 - clamp01((u-.1)/.62), cool = 1 - hot;

  const k = p.k0, cx = p.cx, gy = p.gy, W = innerWidth, H = innerHeight, lw = Math.max(3, 5*k);

  });

  const cp = c=>({x:cx + c.px*capRx, y:capY + c.py*capRx*.92, r:c.r*capRx*(1 + .03*Math.sin(now*.004 + c.ph))});

    heatCols(hot*.5 - .02).base, heatCols(hot*.68 + .08).base, heatCols(hot*.85 + .2).base, heatCols(hot + .34).base
  ], [{dx:-.015*capRx, dy:-.03*capRx, sx:.96, sy:.95}, {dx:-.03*capRx, dy:-.07*capRx, sx:.82, sy:.8}, {dx:-.04*capRx, dy:-.1*capRx, sx:.55, sy:.5}]);

// The ending: everything fades together as ONE picture (so overlapping parts never show through each other),
// drifting up a little, and the last thing you see is a soft blurred bloom of the explosion dying away.
let cloudBuf = null, cloudBufG = null;
function drawCloud(g, p, now){
  const u = (now - p.t0) / p.dur, d = u > .6 ? clamp01((u - .6)/.28) : 0;
  if(d === 0) paintCloud(g, p, now, u);
  else if(d < 1){
    if(!cloudBuf || cloudBuf.width !== fx.width || cloudBuf.height !== fx.height){
      cloudBuf = document.createElement('canvas'); cloudBuf.width = fx.width; cloudBuf.height = fx.height; cloudBufG = cloudBuf.getContext('2d');
    }
    cloudBufG.setTransform(1,0,0,1,0,0); cloudBufG.clearRect(0, 0, cloudBuf.width, cloudBuf.height);
    cloudBufG.setTransform(dpr,0,0,dpr,0,0);
    paintCloud(cloudBufG, p, now, u);
    const e = d*d*(3 - 2*d), W = innerWidth, H = innerHeight;
    g.save();
    g.globalAlpha = 1 - e;
    g.translate(p.cx, p.gy); g.scale(1 + .05*e, 1 + .04*e); g.translate(0, -H*.04*e); g.translate(-p.cx, -p.gy);
    g.drawImage(cloudBuf, 0, 0, W, H);
    g.restore();
  }
  drawBloom(g, p, u);
}
// One last soft blur of light and heat where the cloud was: swells fast, fades slowly. No hard edges.
function drawBloom(g, p, u){
  const b = clamp01((u - .8)/.2); if(b <= 0) return;
  const a = b < .22 ? b/.22 : 1 - ease((b - .22)/.78);
  if(a <= 0) return;
  const W = innerWidth, H = innerHeight, R = Math.max(W, H), r = R*(.12 + .62*ease(b));
  g.save();
  const blob = (x, y, rad, alpha)=>{
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, 'rgba(255,244,200,1)'); gr.addColorStop(.3, 'rgba(255,176,76,.8)');
    gr.addColorStop(.65, 'rgba(226,78,34,.32)'); gr.addColorStop(1, 'rgba(150,30,20,0)');
    g.globalAlpha = alpha; g.fillStyle = gr; g.fillRect(-60, -60, W + 120, H + 120);
  };
  blob(p.cx, H*.34, r, .75*a);
  blob(p.cx, p.gy - 20, r*.85, .45*a);
  g.restore();
}

// Ground shockwave: a thin white-hot streak with a soft glow and a flare in the middle.
function drawStreak(g, p, now){
  const u = (now - p.t0)/p.dur, grow = ease(clamp01(u/.12)), fade = u > .7 ? Math.max(0, 1 - (u-.7)/.3) : 1;
  const W = innerWidth, k = p.k0, y = p.gy - 5*k, w = W*.62*grow, cx = p.cx; if(w < 2) return;
  g.save(); g.globalAlpha = fade;
  g.save(); g.translate(0, y); g.scale(1, .12); g.translate(0, -y);
  const gl = g.createRadialGradient(cx, y, 0, cx, y, w);
  gl.addColorStop(0, 'rgba(255,236,170,.9)'); gl.addColorStop(1, 'rgba(255,200,90,0)');
  g.fillStyle = gl; g.beginPath(); g.arc(cx, y, w, 0, TAU); g.fill(); g.restore();
  const lg = g.createLinearGradient(cx - w, 0, cx + w, 0);
  lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.5, 'rgba(255,255,255,1)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = lg; g.fillRect(cx - w, y - 4*k, 2*w, 8*k);
  const f = 70*k*(.8 + .2*Math.sin(now*.03));

  g.moveTo(cx, y - f); g.lineTo(cx + f*.12, y - f*.12); g.lineTo(cx + f*1.9, y); g.lineTo(cx + f*.12, y + f*.12);
  g.lineTo(cx, y + f); g.lineTo(cx - f*.12, y + f*.12); g.lineTo(cx - f*1.9, y); g.lineTo(cx - f*.12, y - f*.12); g.closePath(); g.fill();

// Ring racing out along the ground.
function drawRing(g, p, now){

  const rx = e*W*.7, ry = Math.max(1, rx*.07); if(rx < 2) return;

  g.lineWidth = Math.max(4, 9*k); g.strokeStyle = '#FFF4C8'; g.beginPath(); g.ellipse(p.cx, y, rx, ry, 0, 0, TAU); g.stroke();
  g.lineWidth = Math.max(2, 4*k); g.strokeStyle = '#FF8A1F'; g.beginPath(); g.ellipse(p.cx, y, rx*.96, ry*.96, 0, 0, TAU); g.stroke();

// The sky goes golden after the flash, then clears.
function drawTint(g, p, now){

// A long white-out: full white for a beat, then it burns off.
function drawFlash(g, p, now){
  const ms = now - p.t0, a = ms < 500 ? 1 : 1 - ease(clamp01((ms-500)/900));
  if(a <= 0) return;
  g.globalAlpha = a; g.fillStyle = '#FFFDF2'; g.fillRect(-60, -60, innerWidth + 120, innerHeight + 120);

// Shudder: a violent jolt that rumbles on and dies away over a few seconds.
const shk = {x:0, y:0};
