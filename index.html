  {id:'stripeM',     view:'today',  sel:'.stepper', phone:true,         w:46, at:r=>[r.left + r.width*.66, r.top + 10]},
  {id:'pointsCard',  view:'today',  sel:'.cardlink[data-go="points"]',  w:40, at:r=>[r.right - 28, r.bottom - 6]},
  {id:'giftPile',    view:'today',  scene:true},
  {id:'workCol',     view:'work',   sel:'#workCols .col:nth-child(3)',  w:46, at:r=>[r.left + r.width*.5, r.bottom - 50]},
  {id:'wkndCol',     view:'wknd',   sel:'#wkndCols .col:nth-child(2)',  w:46, at:r=>[r.left + r.width*.5, r.bottom - 50]},
  {id:'weekCol',     view:'week',   sel:'#weekCols .col:nth-child(6)',  w:46, at:r=>[r.left + r.width*.5, r.bottom - 50]},
  {id:'monthCell',   view:'month',  sel:'#mgrid .cell:nth-child(19)',   w:36, at:r=>[r.right - 10, r.bottom - 4]},
  {id:'listShop',    view:'lists',  sel:'#pShop', phone:true,           w:46, at:r=>[r.right - 44, r.bottom - 8]},
  {id:'listTodo',    view:'lists',  sel:'#pTodo', phone:true,           w:46, at:r=>[r.right - 44, r.bottom - 8]},
  {id:'pointsMaddy', view:'points', sel:'.pcard[data-person="Maddy"]', phone:true, w:46, at:r=>[r.right - 46, r.top + 112]},
  {id:'pointsAva',   view:'points', sel:'.pcard[data-person="Ava"]',   phone:true, w:46, at:r=>[r.right - 46, r.top + 112]}
];
function elfSpots(){ return ELF_SPOTS.filter(s=>!isPhone || s.phone); }
function elfSpotFor(key){ const list = elfSpots(); return list[elfIndex(key, list.length)]; }
function elfActive(){ return theme === 'christmas' && elfActiveOn(elfDayKey()); }
let elfRaf = 0;
function schedElf(){ if(elfRaf) return; elfRaf = requestAnimationFrame(()=>{ elfRaf = 0; placeElf(); }); }
function placeElf(){
  const btn = $('elf'), gift = $('elfGift');
  const hide = ()=>{ btn.classList.remove('on'); if(gift) gift.style.display = 'none'; };
  if(!elfActive()){ hide(); return; }
  const key = elfDayKey();
  if(store.get('fp.elfFound', '') === key){ hide(); return; }
  let sp = elfSpotFor(key);
  // The gift pile only works while the scene has room to show it; on a packed day he moves to the To Do card instead.
  const roomy = () => $('scene').offsetParent !== null && $('scene').getBoundingClientRect().height >= 60;
  if(sp.scene && !roomy() && sectionOf(current) === 'today') sp = ELF_SPOTS.find(s=>s.id === 'todoCard');
  if($('night').classList.contains('on') || sectionOf(current) !== sp.view){ hide(); return; }
  if(sp.scene){
    btn.classList.remove('on');
    if(gift) gift.style.display = 'inline';
    return;
  }
  if(gift) gift.style.display = 'none';
  const el = document.querySelector(sp.sel);
  if(!el || !el.getClientRects().length){ btn.classList.remove('on'); return; }
  const r = el.getBoundingClientRect();
  if(r.width < 10 || r.height < 10){ btn.classList.remove('on'); return; }
  const f = sp.at(r), w = sp.w, h = w*1.5;
  const left = Math.min(Math.max(4, f[0] - w/2), innerWidth - w - 4), top = f[1] - h;
  if(top < 0 || f[1] > innerHeight + 4){ btn.classList.remove('on'); return; }
  btn.style.cssText = 'left:'+left+'px;top:'+top+'px;width:'+w+'px;height:'+h+'px';
  btn.classList.add('on');
}
function elfSay(text, x, y){
  const d = document.createElement('div'); d.className = 'elfsay'; d.textContent = text;
  d.style.left = Math.min(Math.max(90, x), innerWidth - 90) + 'px'; d.style.top = Math.max(10, y) + 'px';
  document.body.appendChild(d); setTimeout(()=>d.remove(), 1800);
}
function elfFound(cx, cy, top){
  store.set('fp.elfFound', elfDayKey());
  puff(cx, cy); sound.poof(); elfSay('Found me!', cx, top - 48);
  const gift = $('elfGift'); if(gift) gift.style.display = 'none';
  $('elf').classList.add('vanish');
  setTimeout(()=>{ $('elf').classList.remove('vanish'); $('elf').classList.remove('on'); }, 220);
  poke();
}
$('elf').innerHTML = '<svg viewBox="0 0 60 90" width="100%" height="100%">'+ELF_INNER+'</svg>';
$('elf').addEventListener('click', e=>{
  e.stopPropagation();
  const r = $('elf').getBoundingClientRect();
  elfFound(r.left + r.width/2, r.top + r.height*.6, r.top);
});
$('scene').addEventListener('click', e=>{
  if(!e.target.closest('[data-elfgift]')) return;
  e.stopPropagation();
  const r = $('elfGift').getBoundingClientRect();
  elfFound(r.left + r.width/2, r.top + r.height*.6, r.top);
});
document.addEventListener('scroll', schedElf, true);

/* ---------------- night ---------------- */
let wokeUntil = 0;
function isNight(){ const h = new Date().getHours(); return !isPhone && (h >= NIGHT_FROM || h < NIGHT_TO); }
function drawNight(){
  const on = isNight() && Date.now() > wokeUntil;
  $('night').classList.toggle('on', on);
  document.body.classList.toggle('night', on);
}
$('night').addEventListener('click', ()=>{ wokeUntil = Date.now() + 2*60*1000; drawNight(); show('today'); sync(); });

/* ---------------- start ---------------- */
drawMute();
applyTheme();
rebuild(); renderAll(); show(current);
drawNight();
if(!cfg) setupScreen(false); else sync();

let lastDay = iso(today());
setInterval(()=>{
  tickClock(); drawNight();
  if(iso(today()) !== lastDay){ lastDay = iso(today()); applyTheme(); renderAll(); }
  else { if(current==='today') renderToday(); placeElf(); }
}, 30000);
setInterval(()=>{
  if(!cfg || document.hidden) return;
  if(isNight() && Date.now() > wokeUntil) return;   // don't poll while dark
  sync();
}, isPhone ? POLL_PHONE : POLL_WALL);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && cfg) sync(); });
addEventListener('online', ()=>{ if(cfg) sync(); });
</script>
</body>
