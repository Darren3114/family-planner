  add(Object.assign({k:'M', t0:t + 80, dur:total - 80, cx, gy, capRx, stemH, k0:k}, buildCloud()));
  const ne = Math.round(70*q);
  for(let i=0;i<ne;i++) add({k:'D', x:rnd(0,W), y:gy - rnd(0, .3)*H, vx:rnd(-1.4,1.4), vy:-rnd(3,9)*k, g:-0.02, t0:t + rnd(500,2200), dur:rnd(1100,2200), s:rnd(5,11)*k, ph:rnd(0,TAU), col:['#FFD23F','#FF7A1A','#FFF3C4','#FF4A1C'][i%4]});
  shudder(reduced ? 0 : 3600);
  loop();
}

// Points milestone: only when a score crosses a multiple of 10 going up, and only once per milestone until it is reset.
function milestoneCross(who, before, after){
  const m = Math.floor(after/10)*10;
  if(m < 10 || Math.floor(after/10) <= Math.floor(before/10)) return 0;
  if(m <= (msDone[who]||0)) return 0;
  msDone[who] = m; store.set('fp.ms', msDone);
  return m;
}
const FW_TIMES = [0, 380, 800, 1250, 1700, 2150, 2650, 3250];
const FW_DURS  = [620,620,620,620,620,620,620,700];
function fireworks(who, m){
  const W = innerWidth, H = innerHeight, t = performance.now(), q = (reduced ? 0.3 : 1) * fxQ;
  const pal = isLight() ? ['#E8231C','#F28A00','#1766D6','#C2188C','#0E9F6E','#7A2BD0'] : ['#FFD83A','#FF5C8A','#5CE1FF','#9DFF6A','#FFFFFF','#FF9A3C','#C79BFF'];
  parts.push({k:'V', t0:t, dur:4500});
  FW_TIMES.forEach((dt,i)=>{
    const last = i === FW_TIMES.length-1;
    parts.push({k:'W', x0:last ? W/2 : W*rnd(.2,.8), y0:H+10, tx:last ? W/2 : W*rnd(.14,.86), ty:last ? H*.34 : H*rnd(.14,.5), t0:t+dt, dur:FW_DURS[i],
      big:last, n:Math.round((last ? 280 : 130 + rnd(0,50))*q), col:pal[i%pal.length], c2:pal[(i+3)%pal.length]});
  });
  const card = document.createElement('div'); card.className = 'mscard';
  card.innerHTML = '<b>'+esc(String(m))+'</b><span style="color:#fff">'+esc(who)+'</span>';
  document.body.appendChild(card); setTimeout(()=>card.remove(), 3700);
  sound.fireworks(FW_TIMES, FW_DURS);
  loop();
}
function explode(p, now, alive){
  const k = Math.max(.45, Math.min(innerWidth, innerHeight)/810);
  for(let i=0;i<p.n;i++){
    if(alive.length >= MAX_PARTS) break;
    const a = rnd(0, TAU), v = (p.big ? 10 : 7.5)*k*Math.sqrt(rnd(.08,1));
    alive.push({k:'S', x:p.tx, y:p.ty, vx:Math.cos(a)*v, vy:Math.sin(a)*v, g:.07*k, t0:now, dur:rnd(1400,2300), col:i%2 ? p.col : p.c2, ph:rnd(0,TAU), w:Math.max(2.2, 4*k)});
  }
}

// Reset score: gold coins rain from the top and spray up from the score.
function coins(who){
  const W = innerWidth, H = innerHeight, k = Math.max(.5, Math.min(W,H)/810);
  let n = reduced ? 30 : Math.round(200*fxQ); n = Math.min(n, room());
  for(let i=0;i<n;i++) parts.push({k:'K', x:rnd(0,W), y:-rnd(20,H*.9), vx:rnd(-.8,.8), vy:rnd(1,4)*k, g:.34*k, term:rnd(9,15)*k, r:rnd(15,26)*k, ph:rnd(0,TAU), vr:rnd(.08,.22)});
  const sc = $('score-'+who), c = sc ? centreOf(sc) : {x:W/2, y:H/2};
  const m = Math.min(reduced ? 0 : Math.round(50*fxQ), room());
  for(let i=0;i<m;i++) parts.push({k:'K', x:c.x + rnd(-30,30), y:c.y, vx:rnd(-6,6)*k, vy:-rnd(12,22)*k, g:.5*k, term:rnd(10,16)*k, r:rnd(15,24)*k, ph:rnd(0,TAU), vr:rnd(.1,.25)});
  loop();
}
function countDownScore(who, from){
  const t0 = performance.now(), dur = Math.min(1600, 500 + from*40);
  (function tick(now){
    const u = Math.min(1, (now - t0)/dur), v = Math.round(from*(1-u)), el = $('score-'+who);
    holdScore[who] = v;
    if(el && el.firstChild) el.firstChild.nodeValue = v;
    if(u < 1) requestAnimationFrame(tick); else { delete holdScore[who]; renderPoints(); }
  })(t0);
}

// Elf vanishing: a cartoon puff of smoke with a few gold sparkles.
function puff(x, y){
  const k = Math.max(0.5, Math.min(innerWidth, innerHeight)/810), t = performance.now(), n = reduced ? 8 : 26;
  for(let i=0;i<n;i++){
    const a = rnd(0, TAU), d = rnd(0, 34)*k;
    parts.push({k:'P', x:x+Math.cos(a)*d, y:y+Math.sin(a)*d*.8, vx:Math.cos(a)*rnd(.3,1.6), vy:Math.sin(a)*rnd(.3,1.2)-rnd(.2,1), t0:t+rnd(0,120), dur:rnd(650,1100), r0:rnd(14,26)*k, r1:rnd(48,92)*k, col:['#F6F2FB','#DCD5E6','#FFFFFF','#C9C0D8'][i%4]});
  }
  if(!reduced) for(let i=0;i<10;i++) parts.push({k:'D', x:x+rnd(-30,30)*k, y:y+rnd(-40,10)*k, vx:rnd(-1.6,1.6), vy:-rnd(1,4)*k, g:.06, t0:t+rnd(0,200), dur:rnd(700,1200), s:rnd(5,9)*k, ph:rnd(0,TAU), col:i%2 ? '#FFD23F' : '#FFFFFF'});
  loop();
}

function drawRay(g, p, now){
  const u = (now - p.t0) / p.dur;
  const tip = p.r0 + (p.r1 - p.r0) * ease(Math.min(1, u*1.6));
  const tail = p.r0 + (p.r1 - p.r0) * Math.pow(u, 1.6) * .8;
  if(tip <= tail) return;
  const c = Math.cos(p.a), s = Math.sin(p.a), hw = tail * p.w;
  g.globalAlpha = Math.max(0, 1 - u*u);
  g.fillStyle = p.col;
  g.beginPath(); g.moveTo(p.x + c*tip, p.y + s*tip);
  g.lineTo(p.x + c*tail - s*hw, p.y + s*tail + c*hw);
  g.lineTo(p.x + c*tail + s*hw, p.y + s*tail - c*hw);
  g.closePath(); g.fill();
}
function drawBurst(g, p, now){
  const u = (now - p.t0) / p.dur;
  const R = p.R * ease(Math.min(1, u/.3));
  g.globalAlpha = u > .45 ? Math.max(0, 1 - (u-.45)/.55) : 1;
  [['#FF3B1F',1],['#FF9A1F',.7],['#FFEB6B',.42]].forEach((l, li)=>{
    g.beginPath();
    for(let i=0;i<p.spikes*2;i++){
      const a = p.seed + i*Math.PI/p.spikes, rr = R*l[1]*(i%2 ? .55 : 1)*p.jit[i];
      const px = p.x + Math.cos(a)*rr, py = p.y + Math.sin(a)*rr;
      if(i) g.lineTo(px, py); else g.moveTo(px, py);
    }
    g.closePath(); g.fillStyle = l[0]; g.fill();
    if(li === 0){ g.lineWidth = 4; g.strokeStyle = '#6E0E0E'; g.lineJoin = 'round'; g.stroke(); }
  });
}

function step(now){
  frames++; fxFrames++;
  const W = innerWidth, H = innerHeight, dtf = Math.min(2.5, Math.max(0, (now - lastT)/16.667)); lastT = now; fxSum += dtf*16.667;
  g2.setTransform(dpr,0,0,dpr,0,0);
  g2.clearRect(0,0,W,H);
  g2.globalCompositeOperation = 'source-over';
  const alive = [];
  for(const p of parts){
    if(p.k === 'c'){
      if(p.delay > 0){ p.delay--; alive.push(p); continue; }
      p.vx *= 0.986; p.vy = Math.min(p.vy*0.99 + 0.42, p.term);
      p.x += p.vx + (p.vy > 0 ? Math.sin(frames*0.09*p.sway + p.ph)*1.3 : 0); p.y += p.vy; p.rot += p.vr;
      if(p.vy > 0 && p.y > H + 30) continue;
      if(p.x < -60 || p.x > W + 60) continue;
      p.life -= 0.0022; if(p.life <= 0) continue;
      alive.push(p); continue;
    }
    if(p.k === 'K'){
      p.vy = Math.min(p.vy + p.g*dtf, p.term); p.x += p.vx*dtf; p.y += p.vy*dtf; p.ph += p.vr*dtf;
      if(p.y > H + 50 && p.vy > 0) continue;
      alive.push(p); continue;
    }
    if(p.k === 'W'){
      if(now >= p.t0 && (now - p.t0)/p.dur >= 1){ explode(p, now, alive); continue; }
      alive.push(p); continue;
    }
    const u = (now - p.t0) / p.dur;
    if(u >= 1) continue;
    if(u >= 0 && p.k === 'S'){ p.x += p.vx*dtf; p.y += p.vy*dtf; p.vy += p.g*dtf; p.vx *= Math.pow(.972, dtf); p.vy *= Math.pow(.985, dtf); }
    if(u >= 0 && (p.k === 'D' || p.k === 'P')){ p.x += p.vx*dtf; p.y += p.vy*dtf; if(p.g) p.vy += p.g*dtf; p.vx *= Math.pow(.99, dtf); }
    alive.push(p);
  }
  const live = k => alive.filter(p=>p.k === k && now >= p.t0);
  live('V').forEach(p=>{
    const u = (now - p.t0)/p.dur;
    g2.globalAlpha = .6*(u < .08 ? u/.08 : (u > .8 ? Math.max(0,(1-u)/.2) : 1)); g2.fillStyle = '#070B2E'; g2.fillRect(0, 0, W, H);
  });
  live('T').forEach(p=>drawTint(g2, p, now));
  live('B').forEach(p=>drawBurst(g2, p, now));
  live('R').forEach(p=>drawRay(g2, p, now));
  g2.save(); g2.translate(shk.x, shk.y);
  live('M').forEach(p=>drawCloud(g2, p, now));
  live('E').forEach(p=>drawRing(g2, p, now));
  live('G').forEach(p=>drawStreak(g2, p, now));
  g2.restore(); g2.globalAlpha = 1;
  live('L').forEach(p=>drawFlash(g2, p, now));
  live('X').forEach(p=>drawRay(g2, p, now));
  live('W').forEach(p=>{
    const u = (now - p.t0)/p.dur, at = v => { const e = 1 - Math.pow(1 - Math.max(0,v), 2); return [p.x0 + (p.tx - p.x0)*e, p.y0 + (p.ty - p.y0)*e]; };
    const a = at(u), b = at(u - .08);
    g2.globalAlpha = 1; g2.strokeStyle = '#FFE9A8'; g2.lineWidth = 3; g2.lineCap = 'round';
    g2.beginPath(); g2.moveTo(b[0], b[1]); g2.lineTo(a[0], a[1]); g2.stroke();
    g2.fillStyle = '#FFFFFF'; g2.beginPath(); g2.arc(a[0], a[1], 3.5, 0, TAU); g2.fill();
  });
  live('S').forEach(p=>{
    const u = (now - p.t0)/p.dur;
    g2.globalAlpha = Math.max(0, 1 - u*u*u)*(.82 + .18*Math.sin(now*.03 + p.ph)); g2.strokeStyle = p.col; g2.lineWidth = p.w; g2.lineCap = 'round';
    g2.beginPath(); g2.moveTo(p.x - p.vx*3.4, p.y - p.vy*3.4); g2.lineTo(p.x, p.y); g2.stroke();
  });
  live('P').forEach(p=>{
    const u = (now - p.t0)/p.dur, r = p.r0 + (p.r1 - p.r0)*ease(u);
    g2.globalAlpha = .92*(1-u); g2.fillStyle = p.col;
    g2.beginPath(); g2.arc(p.x, p.y, r, 0, TAU); g2.fill();
    g2.globalAlpha *= .6; g2.fillStyle = '#FFFFFF'; g2.beginPath(); g2.arc(p.x - r*.22, p.y - r*.22, r*.55, 0, TAU); g2.fill();
  });
  live('D').forEach(p=>{
    const u = (now - p.t0)/p.dur, s = p.s*(.8 + .2*Math.sin(now*.02 + p.ph));
    g2.globalAlpha = u < .7 ? 1 : 1 - (u-.7)/.3; g2.fillStyle = p.col;
    g2.beginPath(); g2.moveTo(p.x, p.y - s); g2.lineTo(p.x + s*.6, p.y); g2.lineTo(p.x, p.y + s); g2.lineTo(p.x - s*.6, p.y); g2.closePath(); g2.fill();
  });
  // gold coins
  for(const p of alive){
    if(p.k !== 'K') continue;
    const sx = Math.max(.14, Math.abs(Math.cos(p.ph))), r = p.r;
    g2.globalAlpha = 1; g2.fillStyle = '#FFC21F'; g2.strokeStyle = '#7A3F00'; g2.lineWidth = Math.max(2, r*.14);
    g2.beginPath(); g2.ellipse(p.x, p.y, r*sx, r, 0, 0, TAU); g2.fill(); g2.stroke();
    g2.strokeStyle = '#E39A0C'; g2.lineWidth = Math.max(1.5, r*.1);
    g2.beginPath(); g2.ellipse(p.x, p.y, r*.68*sx, r*.68, 0, 0, TAU); g2.stroke();
    if(sx > .45){ g2.fillStyle = '#FFF0A0'; g2.beginPath(); g2.ellipse(p.x - r*.28*sx, p.y - r*.3, r*.16*sx, r*.34, .5, 0, TAU); g2.fill(); }
  }
  // confetti on top
  for(const p of alive){
    if(p.k !== 'c' || p.delay > 0) continue;
    const c = Math.cos(p.rot), sn = Math.sin(p.rot);
    g2.setTransform(dpr*c, dpr*sn, -dpr*sn, dpr*c, dpr*p.x, dpr*p.y);
    g2.globalAlpha = Math.min(1, p.life*3);
    g2.fillStyle = p.color;
    g2.fillRect(-p.w/2, -p.h/2, p.w, p.h*Math.abs(Math.cos(p.rot*1.7 + p.ph)) + 1);
  }
  g2.setTransform(dpr,0,0,dpr,0,0);
  g2.globalAlpha = 1;
  parts = alive;
  if(parts.length) requestAnimationFrame(step);
  else {
    running = false; g2.clearRect(0,0,W,H);
    if(fxFrames > 20){ const avg = fxSum/fxFrames; if(avg > 24) fxQ = Math.max(.4, fxQ*.75); else if(avg < 17.5) fxQ = Math.min(1, fxQ*1.12); }
    fxFrames = 0; fxSum = 0;
  }
}
function loop(){
  if(running) return; running = true; lastT = performance.now();
  requestAnimationFrame(step);
}

function placeElf(){

  const roomy = () => $('scene').offsetParent !== null && $('scene').getBoundingClientRect().height >= 60;

// They cycle in whatever room is left under the day's events. Phones don't show them.
const PHOTO_MAX = 60, PHOTO_EDGE = 1400, PHOTO_SECS = 25;
let photoDB = null, photoIds = [], photoPos = 0, photoFront = 'A';
function pdb(){
  if(photoDB) return photoDB;
  photoDB = new Promise((res, rej)=>{
    try{
      const r = indexedDB.open('fp-photos', 1);
      r.onupgradeneeded = ()=>{ r.result.createObjectStore('p', {keyPath:'id', autoIncrement:true}); };
      r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error || new Error('db')); r.onblocked = ()=>rej(new Error('blocked'));
    }catch(e){ rej(e); }
  });
  photoDB.catch(()=>{ photoDB = null; });
  return photoDB;
}
function pTx(mode, fn){
  return pdb().then(db=>new Promise((res, rej)=>{
    let req; const tx = db.transaction('p', mode);
    try{ req = fn(tx.objectStore('p')); }catch(e){ rej(e); return; }
    tx.oncomplete = ()=>res(req && 'result' in req ? req.result : undefined); tx.onerror = ()=>rej(tx.error); tx.onabort = ()=>rej(tx.error);
  }));
}
const photoKeys = ()=>pTx('readonly', st=>st.getAllKeys());
const photoGet = id=>pTx('readonly', st=>st.get(id));
const photoPut = data=>pTx('readwrite', st=>st.add({data}));
const photoWipe = ()=>pTx('readwrite', st=>st.clear());
function fileToDataUrl(file){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = ()=>{
      try{
        const sc = Math.min(1, PHOTO_EDGE/Math.max(im.naturalWidth, im.naturalHeight));
        const w = Math.max(1, Math.round(im.naturalWidth*sc)), h = Math.max(1, Math.round(im.naturalHeight*sc));
        const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h);
        const d = c.toDataURL('image/jpeg', .82); URL.revokeObjectURL(url); res(d);
      }catch(e){ URL.revokeObjectURL(url); rej(e); }
    };
    im.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('image')); };
    im.src = url;
  });
}
function shuffled(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
// Shown only when there is room: the frame fills what's left under the events and hides if that's too little.
function photoLayout(){
  const f = $('pframe'); if(!f) return;
  if(!photoIds.length || isPhone){ f.classList.remove('on'); return; }
  f.classList.add('on'); if(f.offsetHeight < 220) f.classList.remove('on');
}
async function photoShow(){
  if(!photoIds.length){ photoLayout(); return; }
  let rec; try{ rec = await photoGet(photoIds[photoPos % photoIds.length]); }catch(e){ return; }
  if(!rec || !rec.data) return;
  const front = photoFront === 'A' ? $('pslideA') : $('pslideB'), back = photoFront === 'A' ? $('pslideB') : $('pslideA');
  back.innerHTML = '<div class="pbg" style="background-image:url('+rec.data+')"></div><img alt="" src="'+rec.data+'">';
  back.classList.add('on'); front.classList.remove('on'); photoFront = photoFront === 'A' ? 'B' : 'A';
  photoLayout();
}
async function photoReload(){
  try{ photoIds = shuffled(await photoKeys()); }catch(e){ photoIds = []; }
  photoPos = 0; $('pslideA').classList.remove('on'); $('pslideB').classList.remove('on'); photoLayout(); photoShow();
}
setInterval(()=>{
  if(isPhone || document.hidden || !photoIds.length || !$('pframe').classList.contains('on')) return;
  if(isNight() && Date.now() > wokeUntil) return;
  photoPos++; photoShow();
}, PHOTO_SECS*1000);
$('photoIn').addEventListener('change', async ()=>{
  const files = Array.prototype.slice.call($('photoIn').files || []); $('photoIn').value = '';
  if(!files.length) return;
  let have; try{ have = (await photoKeys()).length; }catch(e){ toast('Photos can’t be saved on this device'); return; }
  let added = 0, failed = 0;
  for(let i=0;i<files.length;i++){
    if(have + added >= PHOTO_MAX){ toast('Photo limit reached ('+PHOTO_MAX+')'); break; }
    toast('Adding photo '+(i+1)+' of '+files.length+'…');
    try{ await photoPut(await fileToDataUrl(files[i])); added++; }catch(e){ failed++; }
  }
  toast(added+' photo'+(added === 1 ? '' : 's')+' added'+(failed ? ' ('+failed+' couldn’t be read)' : ''));
  await photoReload();
  if($('modal').classList.contains('on') && $('photoNote')) photoNote();
});
function photoNote(){
  const el = $('photoNote'); if(!el) return;
  photoKeys().then(k=>{
    if($('photoNote')) $('photoNote').textContent = k.length ? k.length+' on this screen. They stay on this device; nothing is uploaded.' : 'Pick photos from this device. They show on days with room to spare, and nothing is uploaded.';
  }).catch(()=>{ if($('photoNote')) $('photoNote').textContent = 'Photos can’t be saved on this device.'; });
}
let photoArm = 0;
function photoClearTap(btn){
  if(!photoArm || Date.now() - photoArm > 4000){ photoArm = Date.now(); btn.textContent = 'Tap again to remove'; return; }
  photoArm = 0; btn.textContent = 'Remove all';
  photoWipe().then(()=>{ toast('Photos removed'); return photoReload(); }).then(()=>{ if($('photoNote')) photoNote(); }).catch(()=>toast('Couldn’t remove the photos'));
}

/* ---------------- start ---------------- */
drawMute();
applyTheme();
rebuild(); renderAll(); show(current); photoReload();
drawNight();
if(!cfg) setupScreen(false); else sync();

let lastDay = iso(today());
setInterval(()=>{
  tickClock(); drawNight();
  if(iso(today()) !== lastDay){ lastDay = iso(today()); applyTheme(); renderAll(); }
  else { if(current==='today') renderToday(); placeElf(); }
}, 30000);
setInterval(()=>{
  if(!cfg || document.hidden) return;
  if(isNight() && Date.now() > wokeUntil) return;   // don't poll while dark
  sync();
}, isPhone ? POLL_PHONE : POLL_WALL);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && cfg) sync(); });
addEventListener('online', ()=>{ if(cfg) sync(); });
</script>
